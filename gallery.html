<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#123b2a">
  <title>Project Gallery | Desert Forest Landscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#f6f3eb;color:#16382b;font-family:Inter,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid rgba(18,59,42,.12)}
    .topbar-inner{max-width:1240px;margin:auto;padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.04em}
    .brand img{width:42px;height:42px;object-fit:contain}
    .back{display:inline-flex;align-items:center;gap:8px;background:#123b2a;color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:800}
    .hero{background:#123b2a;color:white;text-align:center;padding:64px 22px 58px}
    .hero .kicker{font-weight:800;letter-spacing:.16em;font-size:12px;color:#e59a3a}
    .hero h1{font-family:'Playfair Display',serif;font-size:clamp(38px,6vw,68px);line-height:1;margin:12px 0 14px}
    .hero p{margin:0 auto;max-width:610px;color:rgba(255,255,255,.78);line-height:1.7}
    .wrap{max-width:1240px;margin:auto;padding:44px 24px 70px}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .gallery-item{border:0;padding:0;background:#ddd;cursor:pointer;overflow:hidden;border-radius:14px;aspect-ratio:4/3;box-shadow:0 5px 18px rgba(0,0,0,.09)}
    .gallery-item img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .3s ease}
    .gallery-item:hover img{transform:scale(1.035)}
    .lightbox{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px}
    .lightbox.open{display:flex}
    .lightbox img{max-width:min(1200px,94vw);max-height:88vh;object-fit:contain;border-radius:8px}
    .close{position:absolute;right:22px;top:18px;width:46px;height:46px;border:0;border-radius:50%;background:white;color:#123b2a;font-size:30px;line-height:1;cursor:pointer}
    @media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){.topbar-inner{padding:12px 16px}.brand span{font-size:12px}.back{padding:9px 12px;font-size:12px}.hero{padding:45px 18px 40px}.wrap{padding:24px 12px 48px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gallery-item{border-radius:8px;aspect-ratio:1/1}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html#home"><img src="images/logo.png" alt="Desert Forest Landscape logo"><span>DESERT FOREST LANDSCAPE</span></a>
      <a class="back" href="index.html#projects">← BACK TO SITE</a>
    </div>
  </header>
  <section class="hero">
    <span class="kicker">OUR WORK</span>
    <h1>Project Gallery</h1>
    <p>Take a closer look at landscaping projects completed by Desert Forest Landscape.</p>
  </section>
  <main class="wrap">
    <div class="gallery" id="projectGallery" aria-live="polite"></div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Project image preview">
    <button class="close" type="button" aria-label="Close preview">×</button>
    <img id="lightboxImage" src="" alt="Expanded project image">
  </div>
  <script>
    const gallery = document.getElementById('projectGallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const apiUrl = 'https://api.github.com/repos/Merci-Chi/viewyoursite/contents/Sites/desert-forest-landscape/Projects?ref=main';

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function openBox(src) {
      lightboxImage.src = src;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeBox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightboxImage.src = '';
    }

    fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } })
      .then(response => {
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        return response.json();
      })
      .then(files => {
        const pngs = shuffle(files.filter(file =>
          file.type === 'file' && /\.png$/i.test(file.name) && file.download_url
        ));

        gallery.innerHTML = '';
        pngs.forEach((file, index) => {
          const button = document.createElement('button');
          button.className = 'gallery-item';
          button.type = 'button';
          button.setAttribute('aria-label', `Open project image ${index + 1}`);

          const img = document.createElement('img');
          img.src = file.download_url;
          img.alt = `Desert Forest Landscape project ${index + 1}`;
          img.loading = 'lazy';
          img.decoding = 'async';

          button.appendChild(img);
          button.addEventListener('click', () => openBox(file.download_url));
          gallery.appendChild(button);
        });
      })
      .catch(error => {
        console.error('Could not load project images:', error);
        gallery.innerHTML = '<p style="grid-column:1/-1;text-align:center;">Project photos are temporarily unavailable.</p>';
      });

    document.querySelector('.close').addEventListener('click', closeBox);
    lightbox.addEventListener('click', event => { if (event.target === lightbox) closeBox(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeBox(); });
  </script>
</body>
</html>
