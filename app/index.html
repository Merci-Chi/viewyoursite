<script>
/* =================================================================
   Part 6: Editor — topbar, canvas engine, add dock, context menu,
   align toolbar. (Ported/rebuilt from the lost src/editor/*.jsx per
   the recorded behavior in test_reports.)
   ================================================================= */
const EditorApi = {
  isActive: false,
  zoom: () => Store.state.zoom,
  rerender: () => {},
};
let EDITOR_SUB_UNSUB = null;

function EditorView(root, siteId) {
  root.innerHTML = "";
  if (!Store.state.sites[siteId]) {
    root.appendChild(h("div", { class: "empty-note", style: "padding-top:20vh;font-size:.95rem;" },
      "That site doesn't exist in this browser.", h("br"), h("br"),
      h("button", { class: "pill-btn pill-btn-primary", onclick: () => navigate("#/sites") }, icon("arrow-left"), "Back to sites")));
    return null;
  }
  Actions.setActiveSite(siteId);
  ensureSiteFonts(Store.state.sites[siteId]);
  EditorApi.isActive = true;

  const site = () => Store.state.sites[Store.state.activeSiteId];
  const pageSel = () => { const s = site(); return s.pages.find((p) => p.id === s.currentPageId) || s.pages[0]; };

  /* ---------------- DOM scaffold ---------------- */
  const canvasZone = h("div", { class: "canvas-zone hovered no-select", tabindex: "0" });
  const colHolder = h("div", { class: "col-holder" });
  const col = h("div", { class: "col", id: "editor-col" });
  colHolder.appendChild(col);
  canvasZone.appendChild(colHolder);

  const addDockHost = h("div", {});
  const alignToolbarHost = h("div", {});
  const inspectorHost = h("div", { class: "" });
  const panelHost = h("div", {});

  const rootEl = h("div", { class: "editor-root" },
    buildTopbar(),
    canvasZone,
    addDockHost,
    inspectorHost,
    panelHost,
    alignToolbarHost
  );
  root.appendChild(rootEl);

  /* ---------------- helpers ---------------- */
  function scopeZone(scope, sectionId) {
    if (scope === "header") return $('[data-scope-host="header"]', col);
    if (scope === "footer") return $('[data-scope-host="footer"]', col);
    return $(`[data-section-zone="${sectionId}"]`, col);
  }
  function effectiveWidth() {
    const pm = Store.state.previewMode;
    if (pm === "tablet") return 768;
    if (pm === "mobile") return 390;
    return pageSel().canvasWidth || 1280;
  }

  /* ================= CANVAS RENDER ================= */
  let suppressNextEmitRedraw = false;

  function renderColumn() {
    const s = site(); const page = pageSel();
    const z = Store.state.zoom;
    const w = effectiveWidth();
    col.style.setProperty("--z", String(z));
    col.style.transform = `scale(${z})`;
    col.style.width = w + "px";
    col.innerHTML = "";

    // ---- HEADER
    if (s.header.show !== false || true) { // editable even when hidden-from-publish
      const headEl = h("header", {
        class: "scope-host",
        "data-scope-host": "header",
        style: `position:relative;width:100%;height:${s.header.show ? s.header.height : 40}px;${bgCss(s.header.background)};opacity:${s.header.show ? 1 : .5};overflow:hidden;`,
      });
      const layer = h("div", { class: "el-layer", style: `height:${s.header.show ? s.header.height : 40}px;width:100%;position:relative;` });
      headEl.appendChild(layer);
      headEl.appendChild(buildScopeTag("HEADER", s.header));
      attachScopeEvents(headEl, layer, "header");
      col.appendChild(headEl);
    }
    // header content
    (s.header.elements || []).forEach((el) => col.querySelector('[data-scope-host="header"] .el-layer')?.appendChild(buildElementNode(el, "header")));

    // ---- PAGE SECTIONS
    page.sections.forEach((sec, idx) => {
      const secEl = h("section", {
        class: "scope-host",
        "data-section-zone": sec.id,
        "data-testid": `section-${sec.id}`,
        style: `position:relative;width:100%;height:${sec.height}px;${bgCss(sec.background)};overflow:hidden;`,
      });
      const hl = h("div", { class: "sec-hl " + (Store.state.activeSectionId === sec.id && Store.state.editingScope === "main" ? "active" : "") });
      const layer = h("div", { class: "el-layer" });
      if (!sec.elements.length) layer.appendChild(h("div", { class: "section-empty-ph", html: `${esc(sec.name)} — EMPTY` }));
      secEl.append(hl, layer);
      secEl.appendChild(buildScopeTag(sec.name.toUpperCase(), sec, idx, sec.id));
      attachScopeEvents(secEl, layer, "main", sec);
      col.appendChild(secEl);
      sec.elements.forEach((el) => layer.appendChild(buildElementNode(el, "main", sec.id)));
    });

    // ---- FOOTER
    const footEl = h("footer", {
      class: "scope-host",
      "data-scope-host": "footer",
      style: `position:relative;width:100%;height:${s.footer.show ? s.footer.height : 40}px;${bgCss(s.footer.background)};opacity:${s.footer.show ? 1 : .5};overflow:hidden;`,
    });
    const fLayer = h("div", { class: "el-layer", style: `height:${s.footer.show ? s.footer.height : 40}px;width:100%;position:relative;` });
    footEl.append(fLayer);
    footEl.appendChild(buildScopeTag("FOOTER", s.footer));
    attachScopeEvents(footEl, fLayer, "footer");
    col.appendChild(footEl);
    (s.footer.elements || []).forEach((el) => col.querySelector('[data-scope-host="footer"] .el-layer')?.appendChild(buildElementNode(el, "footer")));

    // hold height
    col.style.height = "auto";
    requestAnimationFrame(syncOverlays);
  }

  function buildScopeTag(label, cfg, idx, sectionId) {
    const actions = [];
    if (cfg.height != null) {
      if (idx != null) {
        actions.push(
          h("button", { class: "icon-btn", title: "Move up", onclick: (e) => { e.stopPropagation(); Actions.moveSection(sectionId, "up"); } }, icon("chevron-up")),
          h("button", { class: "icon-btn", title: "Move down", onclick: (e) => { e.stopPropagation(); Actions.moveSection(sectionId, "down"); } }, icon("chevron-down")),
          h("button", { class: "icon-btn", title: "Duplicate section", onclick: (e) => { e.stopPropagation(); Actions.duplicateSection(sectionId); ToastHub("Section duplicated"); } }, icon("duplicate")),
          h("button", { class: "icon-btn", title: "Section settings", "data-testid": `section-settings-${idx != null && sectionId ? sectionId : label}`, onclick: (e) => { e.stopPropagation(); Dialogs.openSectionSettings(sectionId); } }, icon("gear-mini")),
          h("button", { class: "icon-btn", title: "Delete section", onclick: (e) => { e.stopPropagation(); confirmModal({ title: "Delete section?", body: "Its elements will be removed too.", okLabel: "Delete", onConfirm: () => Actions.removeSection(sectionId) }); } }, icon("trash")),
        );
      } else if (label === "HEADER" || label === "FOOTER") {
        const key = label.toLowerCase();
        actions.push(
          h("button", { class: "icon-btn", title: key[0].toUpperCase() + key.slice(1) + " settings", "data-testid": `scope-settings-${key}`, onclick: (e) => { e.stopPropagation(); Dialogs.openScopeSettings(key); } }, icon("gear-mini"))
        );
      }
    }
    const px = cfg.height != null ? `<span style="font-family:var(--font-mono);font-size:9px;">· ${cfg.height}px</span>` : "";
    return h("div", { class: "scope-tag" }, h("span", {}, label, " ", px), h("span", { class: "st-actions" }, ...actions));
  }

  /* ---------- element node factory ---------- */
  function buildElementNode(el, scope, sectionId) {
    const wrap = h("div", {
      class: "element-wrapper" + (el.locked ? " locked" : ""),
      "data-testid": `el-${el.id}`,
      "data-el-id": el.id,
      style: `left:${el.x}px;top:${el.y}px;width:${el.width}px;height:${el.height}px;z-index:${100 + (el.zIndex || 0)};opacity:${el.opacity};transform:rotate(${el.rotation || 0}deg);display:${el.hidden ? "none" : "block"};`,
    });
    const ringH = h("div", { class: "el-hover-ring" });
    const ringS = h("div", { class: "el-sel-ring" });
    const contentWrap = h("div", { class: "el-content", style: el.link?.href || el.link?.kind === "page" ? "cursor:pointer;" : "" });
    const inner = renderElementContent(el, { editable: true });
    inner.style.pointerEvents = "none";
    contentWrap.appendChild(inner);
    wrap.append(ringH, contentWrap, ringS);
    wrap.dataset.scope = scope;
    if (sectionId) wrap.dataset.sectionId = sectionId;
    wrap.addEventListener("pointerdown", (ev) => onElementPointerDown(ev, el, wrap));
    wrap.addEventListener("contextmenu", (ev) => { ev.preventDefault(); ev.stopPropagation(); onElementContextMenu(ev, el); });
    wrap.addEventListener("dblclick", (ev) => beginInlineEdit(el, wrap, ev));
    wrap.addEventListener("click", (ev) => ev.stopPropagation());
    return wrap;
  }

  function allScopeEls(scope, sectionId) {
    const s = site(); const page = pageSel();
    if (scope === "header") return (s.header.elements || []);
    if (scope === "footer") return (s.footer.elements || []);
    return page.sections.find((sec) => sec.id === sectionId)?.elements || [];
  }
  function findWrapper(id) { return col.querySelector(`[data-el-id="${CSS.escape(id)}"]`); }

  /* ================= POINTER INTERACTIONS ================= */
  let dragSession = null;

  function collectSnapTargets(containerEl, excludeIds) {
    const targets = { vx: [], hy: [] }; // vertical lines (x positions), horizontal lines (y positions)
    const crect = { x0: 0, x1: containerEl.offsetWidth, y0: 0, y1: containerEl.offsetHeight };
    targets.vx.push(crect.x0 / 2, crect.x1 / 2, crect.x0, crect.x1);
    targets.hy.push(crect.y0 / 2, crect.y1 / 2, crect.y0, crect.y1);
    $$(".element-wrapper", containerEl).forEach((n) => {
      const id = n.dataset.elId;
      if (excludeIds.includes(id)) return;
      const x0 = parseFloat(n.style.left), y0 = parseFloat(n.style.top);
      const w = parseFloat(n.style.width), hh = parseFloat(n.style.height);
      targets.vx.push(x0, x0 + w / 2, x0 + w);
      targets.hy.push(y0, y0 + hh / 2, y0 + hh);
    });
    return targets;
  }

  function showGuideLines(listV, listH) {
    clearGuides();
    if (!Store.state.showGuides) return;
    const gRoot = document.createElement("div");
    gRoot.id = "guides-root";
    gRoot.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:60;";
    listV.forEach((x) => { const l = h("div", { class: "guide-line v" }); l.style.left = x + "px"; gRoot.appendChild(l); });
    listH.forEach((y) => { const l = h("div", { class: "guide-line h" }); l.style.top = y + "px"; gRoot.appendChild(l); });
    col.appendChild(gRoot);
  }
  function clearGuides() { $("#guides-root", col)?.remove(); }

  function trySnap(rect, targets, thresholdPx) {
    // rect {x,y,w,h}; returns adjusted {dx,dy,guidesV:[],guidesH:[]}
    const th = thresholdPx / Store.state.zoom;
    const edgesX = [rect.x, rect.x + rect.w / 2, rect.x + rect.w];
    const edgesY = [rect.y, rect.y + rect.h / 2, rect.y + rect.h];
    let dx = 0, dy = 0, bestX = th + 1, bestY = th + 1, gv = [], gh = [];
    targets.vx.forEach((t) => edgesX.forEach((e, i) => {
      const d = Math.abs(e - t);
      if (d < Math.min(th, bestX)) { bestX = d; dx = t - e; gv = [t]; }
    }));
    targets.hy.forEach((t) => edgesY.forEach((e) => {
      const d = Math.abs(e - t);
      if (d < Math.min(th, bestY)) { bestY = d; dy = t - e; gh = [t]; }
    }));
    return { dx, dy, gv, gh };
  }

  function onElementPointerDown(ev, el, wrap) {
    if (ev.button === 2) return;
    if (el.locked) return;
    ev.stopPropagation();
    const additive = ev.shiftKey;
    const st = Store.state;
    if (additive && st.selectedIds.includes(el.id)) {
      // shift-click toggle-off
      const remaining = Actions._expandGroupSelection(st.selectedIds).filter((i) => !isInSameGroupAsRemoved(i));
      Store.set({ selectedIds: remaining });
      return;
    }
    function isInSameGroupAsRemoved(_i) { return false; }
    if (!st.selectedIds.includes(el.id)) Actions.select(additive ? [el.id] : [el.id], additive);
    syncOverlays();

    const startId = el.id;
    const moveAll = st.selectedIds.length > 1 ? Actions._expandGroupSelection(st.selectedIds) : [startId];

    dragSession = {
      kind: "move",
      startX: ev.clientX, startY: ev.clientY,
      moved: false,
      primaryId: startId,
      origin: new Map(moveAll.map((id) => {
        const e2 = flatElements(site()).find((q) => q.id === id);
        return [id, { x: e2?.x ?? 0, y: e2?.y ?? 0 }];
      })),
      primaryStart: { x: el.x, y: el.y, w: el.width, h: el.height },
      snapTargets: null,
    };
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp, { once: true });
  }

  function onPointerMove(ev) {
    if (!dragSession) return;
    const ds = dragSession;
    const dxScreen = ev.clientX - ds.startX, dyScreen = ev.clientY - ds.startY;
    if (!ds.moved && Math.hypot(dxScreen, dyScreen) < 3) return;
    if (!ds.moved) {
      ds.moved = true;
      if (ds.kind === "move") {
        pushHistoryQuiet(site());
        const primary = findWrapper(ds.primaryStart.id);
        const contEl = primary ? (primary.closest(".el-layer")) : null;
        if (contEl) ds.snapTargets = collectSnapTargets(contEl, Array.from(ds.origin.keys()));
      }
    }
    let dx = dxScreen / Store.state.zoom, dy = dyScreen / Store.state.zoom;

    if (ds.kind === "resize") {
      let { x, y, w, h } = ds.primaryStart;
      const d = { x: dx, y: dy };
      let nx = x, ny = y, nw = w + d.x, nh = h + d.y;
      const minW = 12, minH = 8;
      switch (ds.dir) {
        case "nw": nx = x + d.x; ny = y + d.y; nw = w - d.x; nh = h - d.y; break;
        case "ne": ny = y + d.y; nw = w + d.x; nh = h - d.y; break;
        case "se": nw = w + d.x; nh = h + d.y; break;
        case "sw": nx = x + d.x; nw = w - d.x; nh = h + d.y; break;
        case "n": ny = y + d.y; nh = h - d.y; break;
        case "s": nh = h + d.y; break;
        case "w": nx = x + d.x; nw = w - d.x; break;
        case "e": nw = w + d.x; break;
      }
      if (nw < minW) { if (nx !== x) nx = x + (nw - minW); nw = minW; }
      if (nh < minH) { if (ny !== y) ny = y + (nh - minH); nh = minH; }
      if (ev.shiftKey && (ds.dir === "se" || ds.dir === "ne" || ds.dir === "nw" || ds.dir === "sw")) {
        nh = Math.max(minH, nw * (h / w)); 
      }
      applyLiveTransform(ds, ds.startElId, { x: nx, y: ny, w: nw, h: nh });
      syncOverlays();
      return;
    }

    // ---- move with snapping (single-selection only)
    let sv = [], sh = [];
    if (!ev.altKey && ds.origin.size === 1 && ds.snapTargets) {
      const primRect = { x: ds.primaryStart.x + dx, y: ds.primaryStart.y + dy, w: ds.primaryStart.w, h: ds.primaryStart.h };
      const snapped = trySnap(primRect, ds.snapTargets, 7);
      dx += snapped.dx; dy += snapped.dy;
      sv = snapped.gv; sh = snapped.gh;
    }
    if (!sv.length && !sh.length) clearGuides(); else showGuideLines(sv, sh);
    ds.origin.forEach((orig, id) => {
      const wr = findWrapper(id);
      if (wr) { wr.style.left = (orig.x + dx) + "px"; wr.style.top = (orig.y + dy) + "px"; }
    });
    syncOverlaysLight();
  }

  function applyLiveTransform(ds, _id, r) {
    const wr = findWrapper(ds.startElId);
    if (wr) { wr.style.left = r.x + "px"; wr.style.top = r.y + "px"; wr.style.width = r.w + "px"; wr.style.height = r.h + "px"; }
  }
  function syncOverlaysLight() {
    // reposition selection outline boxes without rebuilding handles every move
    $$("#sel-overlays .el-sel-ring", col).forEach((ring) => {
      const wr = findWrapper(ring.dataset.forId || "");
      if (!wr) return;
      placeRing(ring, wr);
    });
  }
  function colOffsetOf(wr) {
    const cRect = col.getBoundingClientRect();
    const r = wr.getBoundingClientRect();
    const z = Store.state.zoom || 1;
    return { x: (r.left - cRect.left) / z, y: (r.top - cRect.top) / z, w: r.width / z, h: r.height / z };
  }
  function placeRing(ring, wr) {
    const o = colOffsetOf(wr);
    ring.style.left = o.x + "px"; ring.style.top = o.y + "px";
    ring.style.width = o.w + "px"; ring.style.height = o.h + "px";
  }

  function onPointerUp(ev) {
    window.removeEventListener("pointermove", onPointerMove);
    clearGuides();
    if (!dragSession) return;
    const ds = dragSession; dragSession = null;
    if (ds.kind === "marquee") { finishMarquee(ev); return; }
    if (!ds.moved) return;
    const ox = ds.primaryStart.x, oy = ds.primaryStart.y;
    const ow = ds.primaryStart.w, oh = ds.primaryStart.h;
    const ids = Array.from(ds.origin.keys());
    if (ds.kind === "move") {
      const primWr = findWrapper(ds.primaryId);
      if (!primWr) return;
      const dxApplied = parseFloat(primWr.style.left) - ox;
      const dyApplied = parseFloat(primWr.style.top) - oy;
      ds.origin.forEach((orig, id) => {
        Actions.updateElement(id, () => ({ x: Math.round(orig.x + dxApplied), y: Math.round(orig.y + dyApplied) }), { history: false });
      });
      Actions.updateElement(ds.primaryId, (e) => ({ x: e.x }), {}); // single history entry
    } else if (ds.kind === "resize") {
      const wr = findWrapper(ds.startElId);
      const r = { left: parseFloat(wr.style.left), top: parseFloat(wr.style.top), w: parseFloat(wr.style.width), h: parseFloat(wr.style.height) };
      Actions.updateElement(ds.startElId, () => ({ x: Math.round(r.left), y: Math.round(r.top), width: Math.round(r.w), height: Math.round(r.h) }));
    }
    void [ox, oy, ow, oh];
  }

  /* ----- resize handle management ----- */
  const HANDLES = ["nw", "n", "ne", "e", "se", "s", "sw", "w"];
  let overlaysLayer = null;
  function ensureOverlaysLayer() {
    if (overlaysLayer && overlaysLayer.isConnected) return overlaysLayer;
    overlaysLayer = h("div", { id: "sel-overlays", style: "position:absolute;left:0;top:0;width:100%;height:0;z-index:120;pointer-events:none;" });
    col.appendChild(overlaysLayer);
    return overlaysLayer;
  }
  function syncOverlays() {
    ensureOverlaysLayer();
    $$(".el-sel-ring,.resize-handle", overlaysLayer).forEach((n) => n.remove());
    $$(".element-wrapper", col).forEach((wr) => {
      wr.classList.toggle("selected", Store.state.selectedIds.includes(wr.dataset.elId));
    });
    Store.state.selectedIds.forEach((id) => {
      const wr = findWrapper(id); if (!wr) return;
      const ou = h("div", { class: "el-sel-ring", dataset: { forId: id }, style: "display:block;position:absolute;pointer-events:none;transform:rotate(" + extractRot(wr) + "deg);" });
      placeRing(ou, wr);
      overlaysLayer.appendChild(ou);
      if (Store.state.selectedIds.length === 1 && !isLockedId(id)) {
        HANDLES.forEach((dir) => {
          const hs = calcHandleSize();
          const hd = h("div", { class: "resize-handle", dataset: { dir, elId: id }, style: calcHandlePos(dir, wr, hs) });
          hd.addEventListener("pointerdown", (ev) => startResize(ev, id, dir));
          overlaysLayer.appendChild(hd);
        });
      }
    });
    syncAlignToolbar();
  }
  function extractRot(wr) {
    const fel = flatElements(site()).find((e) => e.id === wr.dataset.elId);
    return String(fel?.rotation || 0);
  }
  function calcHandleSize() {
    return Math.max(5, 9 / Store.state.zoom);
  }
  function calcHandlePos(dir, wr, size) {
    const o = colOffsetOf(wr);
    const left = o.x, top = o.y, w = o.w, hgt = o.h;
    const cxm = left + w / 2, cym = top + hgt / 2;
    const map = {
      nw: [left, top], n: [cxm, top], ne: [left + w, top],
      e: [left + w, cym], se: [left + w, top + hgt], s: [cxm, top + hgt],
      sw: [left, top + hgt], w: [left, cym],
    };
    const [x, y] = map[dir];
    const bw = 1.5 / Store.state.zoom;
    return `width:${size}px;height:${size}px;left:${x - size / 2}px;top:${y - size / 2}px;border-width:${bw}px;transform-origin:center;`;
  }
  function syncHandlesFor(id, _r) { syncOverlays(); void id; }
  function isLockedId(id) {
    const els = flatElements(site());
    return !!els.find((e) => e.id === id)?.locked;
  }
  function flatElements(s) {
    const out = [...(s.header?.elements || []), ...(s.footer?.elements || [])];
    s.pages.forEach((p) => p.sections?.forEach((sec) => out.push(...(sec.elements || []))));
    return out;
  }

  function startResize(ev, id, dir) {
    ev.stopPropagation(); ev.preventDefault();
    const el = flatElements(site()).find((e) => e.id === id); if (!el) return;
    pushHistoryQuiet(site());
    dragSession = {
      kind: "resize", dir, startElId: id,
      startX: ev.clientX, startY: ev.clientY, moved: false,
      primaryStart: { x: el.x, y: el.y, w: el.width, h: el.height },
    };
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp, { once: true });
  }
  function pushHistoryQuiet(s) { if (s) pushHistory(s); }

  /* ================= MARQUEE ================= */
  function finishMarquee(endEv) {
    const ds = marqueeSession; marqueeSession = null;
    if (!ds) return;
    $(".marquee-box", col)?.remove();
    const zone = ds.zone; if (!zone) return;
    const b = ds.box, zb = zone.getBoundingClientRect();
    const selRect = { x0: Math.min(b.x0, b.x1) - zb.left, x1: Math.max(b.x0, b.x1) - zb.left, y0: Math.min(b.y0, b.y1) - zb.top, y1: Math.max(b.y0, b.y1) - zb.top };
    const hits = [];
    $$(".element-wrapper", zone).forEach((wr) => {
      const x0 = parseFloat(wr.style.left), y0 = parseFloat(wr.style.top);
      const x1 = x0 + parseFloat(wr.style.width), y1 = y0 + parseFloat(wr.style.height);
      const inter = !(selRect.x1 < x0 || selRect.x0 > x1 || selRect.y1 < y0 || selRect.y0 > y1);
      if (inter) hits.push(wr.dataset.elId);
    });
    if (hits.length) Actions.select(hits, endEv.shiftKey);
    else Actions.clearSelection();
    void ds.startClient;
  }
  let marqueeSession = null;

  /* ================= SCOPE EVENTS ================= */
  function attachScopeEvents(hostEl, layer, scope, sec) {
    hostEl.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0) return;
      if (ev.target.closest(".element-wrapper")) return;
      if (ev.target.closest(".st-actions")) return;
      ev.preventDefault();
      if (scope === "main" && sec) { Store.set({ activeSectionId: sec.id }); Actions.setEditingScope("main"); }
      else Actions.setEditingScope(scope);
      if (scope === "header" || scope === "footer") { /* keep activeSection for later */ }
      // possible marquee
      const box = h("div", { class: "marquee-box" });
      marqueeSession = { zone: layer, box, x0: ev.clientX, y0: ev.clientY, startClient: { x: ev.clientX, y: ev.clientY } };
      window.addEventListener("pointermove", marqueeMove);
      window.addEventListener("pointerup", marqueeUp, { once: true });

    if (!marqueeSession) return;
    const ms = marqueeSession;
    if (Math.abs(ev.clientX - ms.x0) < 4 && Math.abs(ev.clientY - ms.y0) < 4 && !ms.box.isConnected) return;
    if (!ms.box.isConnected) ms.zone.appendChild(ms.box);
    const zb = ms.zone.getBoundingClientRect();
    ms.box.x0 = ms.x0; ms.box.x1 = ev.clientX; ms.box.y0 = ms.y0; ms.box.y1 = ev.clientY;
    ms.box.style.left = (Math.min(ms.x0, ev.clientX) - zb.left) / Store.state.zoom + "px";
    ms.box.style.top = (Math.min(ms.y0, ev.clientY) - zb.top) / Store.state.zoom + "px";
    ms.box.style.width = Math.abs(ev.clientX - ms.x0) / Store.state.zoom + "px";

  /* ================= INLINE TEXT EDIT ================= */
  function beginInlineEdit(el, wrap, ev) {
    const editableTypes = ["text", "heading"];
    const buttonType = el.type === "button";
    if (!editableTypes.includes(el.type) && !buttonType) return;
    const target = editableTypes.includes(el.type)
      ? wrap.querySelector(".ce-target")
      : wrap.querySelector(".el-content span.ce-target");
    if (!target) return;
    ev.stopPropagation();
    target.setAttribute("contenteditable", "true");
    target.classList.add("editing");
    target.focus();
    try { document.getSelection().selectAllChildren(target); } catch {}
    const commit = () => {
      target.removeEventListener("blur", commit);
      target.removeAttribute("contenteditable");
      target.classList.remove("editing");
      const val = editableTypes.includes(el.type) ? target.innerHTML : stripTags(target.textContent).replace(/\s+/g, " ").trim();
      const cleaned = editableTypes.includes(el.type) ? sanitizeInline(val) : val;
      const before = editableTypes.includes(el.type) ? el.props.html : el.props.label;
      if (cleaned !== before) Actions.updateElementProps(el.id, editableTypes.includes(el.type) ? { html: cleaned } : { label: cleaned });
      else renderColumn();
    };
    target.addEventListener("blur", commit);
    target.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && buttonType) { e.preventDefault(); target.blur(); }
      if (e.key === "Enter" && !e.shiftKey && !buttonType) { e.preventDefault(); target.blur(); }
      if (e.key === "Escape") { target.blur(); }
      e.stopPropagation();
    });
    void ev;
  }
  function sanitizeInline(html) {
    const tmp = document.createElement("div"); tmp.innerHTML = html;
    tmp.querySelectorAll("*").forEach((n) => {
      [...n.attributes].forEach((a) => { if (!["style"].includes(a.name.toLowerCase())) n.removeAttribute(a.name); });
      const st = n.getAttribute("style") || "";
      const keep = st.split(";").filter((s) => { const k = s.split(":")[0]?.trim(); return ["font-weight","font-style","text-decoration","background-color","color"].includes(k); }).join(";");
      if (keep) n.setAttribute("style", keep); else n.removeAttribute("style");
    });
    return tmp.innerHTML;
  }

  function onKeyDown(e) {
    const tag = document.activeElement?.tagName;
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(tag) || document.activeElement?.isContentEditable;
    if (ContextMenuManager.node && e.key === "Escape") { ContextMenuManager.close(); return; }
    if ($$(".modal-overlay").length) return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); Actions.undo(); return; }
    if (mod && ((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y")) { e.preventDefault(); Actions.redo(); return; }
    if (typing) return;
    const sel = Store.state.selectedIds;
    if (mod && e.key.toLowerCase() === "c") { e.preventDefault(); Actions.copySelection(); return; }
    if (mod && e.key.toLowerCase() === "x") { e.preventDefault(); Actions.copySelection(); Actions.removeElements(sel); return; }

    if (pageIdOverride) { buildFor.currentPageId = pageIdOverride; }
    const shell = h("div", { class: "preview-shell" });
    const frameWrap = h("div", { class: "preview-frame-wrap" });
    const iframe = h("iframe", { class: "preview-iframe", sandbox: "allow-scripts allow-popups", "data-testid": "preview-iframe" });
    iframe.style.width = "100%";
    frameWrap.appendChild(iframe);
    const bar = h("div", { class: "preview-bar" },
      h("span", { style: "font-weight:600;font-size:.8rem;" }, "Preview — ", esc(buildFor.name)),
      h("span", { class: "divider-v", style: "background:hsl(0 0% 100%/.25)" }),
      h("div", { class: "device-btns", style: "display:flex;gap:3px" },
        devB("desktop", "monitor"), devB("tablet", "tablet"), devB("mobile", "smartphone")),
      h("span", { style: "flex:1" }),
      h("button", { class: "pill-btn", style: "border-color:hsl(0 0% 100%/.35);color:#fff;", "data-testid": "preview-close", onclick: closeShell }, icon("x"), "Close  (Esc)"));
    shell.append(bar, frameWrap);
    function devB(mode, icn) {
      const b = h("button", { class: mode === "desktop" ? "on" : "", title: capitalize(mode) }, icon(icn));
      b.addEventListener("click", () => {
        $$(".device-btns button", shell).forEach((x) => x.classList.remove("on")); b.classList.add("on");
        iframe.style.width = mode === "mobile" ? "390px" : mode === "tablet" ? "768px" : "100%";
      });
      return b;
    }
    function closeShell() { shell.remove(); window.removeEventListener("keydown", escHandler); }
    function escHandler(e) { if (e.key === "Escape") { closeShell(); } }
    window.addEventListener("keydown", escHandler);
    iframe.srcdoc = exportSiteHTML(buildFor);
    document.body.appendChild(shell);
    setTimeout(() => document.querySelector(".preview-close")?.focus(), 50);
  }
  window.__openPreviewOverlay = openPreviewOverlay;

  renderSidePanel();

  /* -------- reactive plumbing for UI hosts -------- */
  const unsub = Store.sub(() => {
    InspectorAPI.render(document.querySelector(".editor-root") ? inspectorHost : null);
    renderSidePanel();
  });

  return {
    renderPanels: renderSidePanel,
    cleanup: () => { unsub(); closePanels(); $$(".modal-overlay").forEach((n) => n.remove()); $$(".preview-shell").forEach((n) => n.remove()); ContextMenuCleanupGlobal(); },
  };
}
function ContextMenuCleanupGlobal() { document.querySelectorAll(".ctx-menu").forEach((n) => n.remove()); }

</script>
<script>
/* =================================================================
   Part 8: Public share view + boot.
   ================================================================= */
function ShareView(root, specRaw) {
  root.innerHTML = "";
  let siteData = null;

  if (specRaw.startsWith("?d=")) {
    try {
      const b64 = specRaw.slice(3).replace(/-/g, "+").replace(/_/g, "/");
      const json = decodeURIComponent(escape(atob(b64)));
      siteData = JSON.parse(json);
    } catch { siteData = null; }
  } else {
    const sid = decodeURIComponent(specRaw);
    const rec = ShareStore.get(sid);
    if (rec?.site) siteData = JSON.parse(JSON.stringify(rec.site));
  }

  if (!siteData) {
    root.appendChild(h("div", { style: "min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:2rem;text-align:center;" },
      h("div", { class: "wordmark", style: "justify-content:center;" }, h("span", { class: "dot" }), "Studio"),
      h("div", { style: "font-family:var(--font-display);font-size:1.6rem;margin-top:.6rem;" }, "This shared link can't be found."),
      h("p", { style: "color:hsl(var(--ink-soft));font-size:.85rem;max-width:44ch;line-height:1.6;" },
        "Device-local shares live only in the browser that published them — embedded links work anywhere this same file is open."),
      h("button", { class: "pill-btn pill-btn-primary", onclick: () => navigate("#/") }, icon("arrow-left"), "Back to Studio")));
    return () => {};
  }
  siteData = migrateSite(siteData);

  const bar = h("div", {
    style: "position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;background:hsl(var(--ink)/.92);backdrop-filter:blur(12px);color:hsl(var(--paper));border-radius:999px;padding:.5rem .9rem;font-size:.7rem;display:flex;gap:.65rem;align-items:center;box-shadow:0 16px 44px -14px hsl(0 0% 0%/.55);",
  },
    icon("eye"),
    h("span", {}, h("b", {}, esc(siteData.name || "Untitled")), " · shared preview"),
    h("button", { class: "pill-btn", style: "border-color:hsl(0 0% 100%/.4);color:#fff;padding:.28rem .6rem;", onclick: () => navigate("#/editor/" + siteData.id).catch?.(() => {}) || navigate("#/") }, "Edit"));
  // "Edit" only makes sense on the owning browser; hide when local copy absent
  if (!Store.state.sites[siteData.id]) bar.querySelector("button:last-child")?.remove();

  const frame = h("iframe", { sandbox: "allow-scripts allow-popups allow-forms allow-modals allow-same-origin", class: "share-iframe" });
  frame.srcdoc = exportSiteHTML(siteData);

  root.appendChild(h("div", { class: "share-root fade-in" }, frame));
  document.body.appendChild(bar);
  return function cleanup() { bar.remove(); };
}

/* =================================================================
   BOOT
   ================================================================= */
(function boot() {
  window.addEventListener("error", (ev) => {
    console.error("[studio]", ev.error || ev.message);
  });
  renderRoute();
  /* dev/test hooks */
  window.__st = { Store, Actions, QR, exportSiteHTML, parseHash, navigate };
})();

</script>
