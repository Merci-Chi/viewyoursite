<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Studio — single-file site builder</title>
<meta name="description" content="A local-first, Wix-like website builder in a single HTML file."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ============ Tokens (ported from app index.css) ============ */
:root{
  --ink:0 0% 0%; --ink-soft:0 0% 25%;
  --paper:0 0% 100%; --paper-2:0 0% 98%; --paper-3:0 0% 95%;
  --line:0 0% 88%; --line-strong:0 0% 75%;
  --muted-fg:0 0% 45%;
  --ok:0 0% 20%; --err:0 0% 10%;
  --font-display:"Fraunces",ui-serif,Georgia,serif;
  --font-ui:"DM Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --radius:.85rem;
  --shadow-panel:0 1px 0 hsl(0 0% 100% / .8) inset,0 8px 32px -8px hsl(0 0% 0% / .14),0 2px 6px -2px hsl(0 0% 0% / .06);
}
*{border-color:hsl(var(--line));box-sizing:border-box;}
html,body{height:100%;margin:0;background:hsl(var(--paper));color:hsl(var(--ink));font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px;}
#app{height:100%;outline:none;}
h1,h2,h3,h4{margin:0;font-weight:500;}
p{margin:0;}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
input,textarea,select{font-family:inherit;color:hsl(var(--ink));background:hsl(var(--paper));border:1px solid hsl(var(--line-strong));border-radius:.55rem;padding:.42rem .6rem;font-size:.82rem;width:100%;transition:border-color .15s ease;}
input:focus,textarea:focus,select:focus{outline:none;border-color:hsl(var(--ink));}
input[type=range]{padding:0;border:none;height:18px;accent-color:#000;}
input[type=color]{padding:1px;height:28px;width:34px;border-radius:.45rem;cursor:pointer;}
input[type=file]{display:none;}
label.fld{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--muted-fg));margin:0 0 .28rem;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
*:hover::-webkit-scrollbar-thumb{background:hsl(var(--line));border-radius:8px;}
*.hovered:hover::-webkit-scrollbar-thumb:hover{background:hsl(var(--ink)/.35);}
a{color:inherit;text-decoration:none;}
.font-display{font-family:var(--font-display);font-optical-sizing:auto;}
.font-mono{font-family:var(--font-mono);}
.fade-in{animation:fade-in 220ms ease both;}
@keyframes fade-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.pop-in{animation:pop-in 180ms cubic-bezier(.2,.9,.3,1.15) both;}
@keyframes pop-in{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
/* ============ Shared surfaces ============ */
.float-panel{background:hsl(var(--paper)/.92);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid hsl(var(--line));box-shadow:var(--shadow-panel);border-radius:14px;}
.float-panel-dark{background:hsl(var(--ink)/.95);backdrop-filter:blur(18px);color:hsl(var(--paper));border:1px solid hsl(var(--ink)/.7);box-shadow:0 12px 40px -12px hsl(0 0% 0%/.5);border-radius:12px;}
.pill-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.38rem .8rem;border-radius:999px;background:transparent;border:1px solid hsl(var(--line));font-weight:500;font-size:.78rem;line-height:1;white-space:nowrap;transition:transform 120ms ease,background 200ms ease,border-color 200ms ease,color 150ms ease;cursor:pointer;user-select:none;}
.pill-btn svg{width:13px;height:13px;flex:none;}
.pill-btn:hover{background:hsl(var(--paper-3));border-color:hsl(var(--line-strong));}
.pill-btn:active{transform:translateY(1px);}
.pill-btn-primary{background:hsl(var(--ink));color:hsl(var(--paper));border-color:hsl(var(--ink));}
.pill-btn-primary:hover{background:hsl(0 0% 15%);border-color:hsl(0 0% 15%);}
.pill-btn.is-on{background:hsl(var(--ink));color:hsl(var(--paper));border-color:hsl(var(--ink));}
.pill-btn[disabled]{opacity:.35;pointer-events:none;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:hsl(var(--ink-soft));cursor:pointer;flex:none;position:relative;}
.icon-btn svg{width:14px;height:14px;}
.icon-btn:hover{background:hsl(var(--paper-3));color:hsl(var(--ink));}
.icon-btn.is-on{background:hsl(var(--ink));color:hsl(var(--paper));}
.icon-btn[data-disabled]{opacity:.3;pointer-events:none;}
.seg{display:inline-flex;border:1px solid hsl(var(--line));border-radius:999px;padding:2px;gap:2px;background:hsl(var(--paper));}
.seg button{border-radius:999px;padding:.28rem .62rem;font-size:.72rem;font-weight:500;display:inline-flex;align-items:center;gap:.32rem;color:hsl(var(--ink-soft));line-height:1;cursor:pointer;}
.seg button svg{width:12px;height:12px;}
.seg button:hover{color:hsl(var(--ink));}
.seg button.is-on{background:hsl(var(--ink));color:hsl(var(--paper));}
.kbd{font-family:var(--font-mono);font-size:.62rem;border:1px solid hsl(var(--line));border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:hsl(var(--paper-2));color:hsl(var(--ink-soft));}
.divider-v{width:1px;height:20px;background:hsl(var(--line));margin:0 4px;flex:none;}
.hint-tt{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:hsl(var(--ink));color:hsl(var(--paper));font-size:.62rem;padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60;}
.icon-btn:hover .hint-tt,.pill-btn:hover .hint-tt{opacity:1;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.no-select,.no-select *{user-select:none !important;}
.empty-note{font-size:.75rem;color:hsl(var(--muted-fg));text-align:center;padding:1rem .5rem;line-height:1.6;}
.field-row{display:flex;gap:6px;}
.dashed-frame{background-image:repeating-linear-gradient(45deg,hsl(0 0% 88%) 0 6px,transparent 6px 12px);}
[contenteditable][data-empty="true"]:before{content:attr(data-placeholder);color:hsl(var(--muted-fg));pointer-events:none;}
[contenteditable]:focus{outline:none;}
/* ============ Landing ============ */
.landing-root{min-height:100%;display:flex;flex-direction:column;overflow-x:hidden;}
.land-nav{display:flex;align-items:center;justify-content:space-between;padding:1.1rem clamp(1.2rem,4vw,3rem);}
.wordmark{font-family:var(--font-display);font-size:1.25rem;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:.5rem;}
.wordmark .dot{width:9px;height:9px;background:#000;border-radius:50%;display:inline-block;}
.hero{max-width:1200px;margin:0 auto;width:100%;padding:clamp(2rem,6vh,4rem) clamp(1.2rem,4vw,3rem) 2rem;text-align:center;}
.hero-kicker{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:hsl(var(--ink-soft));display:inline-flex;align-items:center;gap:.6rem;}
.hero-kicker:before,.hero-kicker:after{content:"";height:1px;width:34px;background:hsl(var(--line-strong));display:inline-block;}
.hero h1{font-family:var(--font-display);font-weight:500;font-size:clamp(2.6rem,7vw,5.4rem);line-height:1.02;letter-spacing:-.02em;margin:1.4rem auto 1.2rem;max-width:16ch;}
.hero h1 em{font-style:italic;}
.hero p.lede{color:hsl(var(--ink-soft));font-size:clamp(.95rem,1.4vw,1.06rem);max-width:56ch;margin:0 auto 1.8rem;line-height:1.65;}
.cta-row{display:flex;gap:.7rem;justify-content:center;align-items:center;flex-wrap:wrap;}
.cta-big{display:inline-flex;align-items:center;gap:.55rem;background:#000;color:#fff;border-radius:999px;padding:.85rem 1.6rem;font-size:.92rem;font-weight:600;transition:transform .15s ease,background .2s ease;}
.cta-big:hover{transform:translateY(-2px);background:hsl(0 0% 12%);}
.cta-big:active{transform:translateY(0);}
.cta-ghost{display:inline-flex;align-items:center;gap:.5rem;border:1px solid hsl(var(--line-strong));border-radius:999px;padding:.85rem 1.4rem;font-size:.9rem;font-weight:500;transition:border-color .2s;}
.cta-ghost:hover{border-color:#000;}
.land-stage{max-width:1200px;width:100%;margin:2rem auto 0;padding:0 clamp(1.2rem,4vw,3rem) 1rem;}
.mock-editor{position:relative;border:1px solid hsl(var(--line));border-radius:18px;background:hsl(var(--paper));box-shadow:0 30px 80px -30px hsl(0 0% 0%/.25);overflow:hidden;text-align:left;}
.mock-topbar{height:44px;border-bottom:1px solid hsl(var(--line));display:flex;align-items:center;gap:10px;padding:0 14px;background:hsl(var(--paper-2)/.7);}
.mock-topbar .seg-mini{display:flex;gap:4px;background:hsl(var(--paper-3));border-radius:999px;padding:3px;}
.mock-topbar .seg-mini span{width:52px;height:14px;border-radius:999px;background:transparent;}
.mock-topbar .seg-mini span.on{background:#000;}
.mock-body{display:flex;min-height:min(430px,54vh);}
.mock-canvas{flex:1;position:relative;background-image:radial-gradient(hsl(0 0% 88%) 1px,transparent 1px);background-size:20px 20px;padding:22px;}
.mock-el{position:absolute;border:1px solid transparent;}
.mock-h{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em;}
.mock-p{color:hsl(var(--ink-soft));font-size:11px;line-height:1.55;}
.mock-btn{background:#000;color:#fff;border-radius:999px;font-size:10px;display:inline-flex;align-items:center;padding:6px 14px;width:max-content;}
.mock-img{background-image:repeating-linear-gradient(45deg,hsl(0 0% 90%) 0 6px,transparent 6px 12px);border-radius:8px;}
.mock-selected{border:1.5px solid #000 !important;position:absolute;}
.handle-dot{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid #000;border-radius:99px;}
.mock-inspector{width:212px;border-left:1px solid hsl(var(--line));padding:12px;display:flex;flex-direction:column;gap:9px;background:hsl(var(--paper));}
.mock-inspector .mi-row{height:24px;border:1px solid hsl(var(--line));border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:9px;color:hsl(var(--muted-fg));justify-content:space-between;}
.mock-inspector .mi-label{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-fg));}
.features{max-width:1080px;margin:0 auto;width:100%;padding:clamp(2.5rem,7vh,4.5rem) clamp(1.2rem,4vw,3rem);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2.2rem 3rem;border-top:1px solid hsl(var(--line));}
.feature .fnum{font-family:var(--font-mono);font-size:.68rem;color:hsl(var(--muted-fg));letter-spacing:.1em;}
.feature h3{font-family:var(--font-display);font-size:1.28rem;margin:.55rem 0 .5rem;font-weight:500;}
.feature p{color:hsl(var(--ink-soft));font-size:.84rem;line-height:1.65;}
.land-foot{border-top:1px solid hsl(var(--line));padding:1.1rem clamp(1.2rem,4vw,3rem);display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:hsl(var(--muted-fg));}
/* ============ Sites dashboard ============ */
.sites-root{min-height:100%;display:flex;flex-direction:column;}
.sites-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.05rem clamp(1.2rem,4vw,3rem);border-bottom:1px solid hsl(var(--line));}
.sites-main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:2.2rem clamp(1.2rem,4vw,3rem) 4rem;}
.sites-title{font-family:var(--font-display);font-size:1.7rem;font-weight:500;letter-spacing:-.01em;display:flex;align-items:baseline;gap:.8rem;}
.sites-count{font-family:var(--font-mono);font-size:.72rem;color:hsl(var(--muted-fg));}
.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.1rem;margin-top:1.6rem;}
.site-card{border:1px solid hsl(var(--line));border-radius:16px;background:hsl(var(--paper));padding:1.15rem 1.2rem;display:flex;flex-direction:column;gap:1.6rem;min-height:170px;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;cursor:pointer;position:relative;}
.site-card:hover{border-color:hsl(var(--ink));box-shadow:0 18px 40px -22px hsl(0 0% 0%/.35);transform:translateY(-3px);}
.site-card .sc-name{font-family:var(--font-display);font-size:1.22rem;font-weight:500;overflow-wrap:anywhere;}
.site-card .sc-meta{font-size:.72rem;color:hsl(var(--muted-fg));display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;}
.site-card .sc-actions{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .18s ease;}
.site-card:hover .sc-actions{opacity:1;}
.card-new{border-style:dashed;align-items:center;justify-content:center;gap:.8rem;color:hsl(var(--muted-fg));min-height:190px;background:hsl(var(--paper-2)/.4);}
.card-new:hover{color:hsl(var(--ink));background:hsl(var(--paper-2));}
.card-new .cn-plus{width:34px;height:34px;border:1px solid hsl(var(--line-strong));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.sc-home-badge{font-family:var(--font-mono);font-size:.58rem;border:1px solid hsl(var(--line-strong));padding:1px 6px;border-radius:99px;letter-spacing:.06em;}
/* ============ Editor chrome ============ */
.editor-root{height:100%;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:50px;flex:none;display:flex;align-items:center;gap:6px;padding:0 .65rem;border-bottom:1px solid hsl(var(--line));background:hsl(var(--paper)/.96);backdrop-filter:blur(14px);z-index:50;position:relative;overflow-x:auto;scrollbar-width:none;}
.topbar::-webkit-scrollbar{display:none;}
.tb-site{flex:none;font-weight:600;font-size:.82rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;border-radius:8px;cursor:text;}
.tb-site:hover{background:hsl(var(--paper-3));}
.canvas-zone{flex:1;position:relative;overflow:auto;background:hsl(var(--paper-3));outline:none;}
.canvas-grid-bg{background-image:radial-gradient(hsl(0 0% 85%) 1px,transparent 1px);background-size:20px 20px;}
.col-holder{position:relative;width:100%;display:flex;justify-content:center;padding:34px 0 120px;}
.col{position:relative;background:hsl(var(--paper));transform-origin:top center;box-shadow:0 2px 0 hsl(var(--line)),0 26px 70px -30px hsl(0 0% 0%/.3),0 0 0 1px hsl(var(--line));--z:1;}
.scope-tag{position:absolute;left:2px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:hsl(var(--muted-fg));pointer-events:none;z-index:30;top:-20px;display:flex;gap:.6rem;align-items:baseline;}
.scope-tag .st-actions{display:inline-flex;gap:2px;opacity:0;transition:opacity .15s;}
.scope-host:hover .scope-tag .st-actions{opacity:1;}
.scope-host{position:relative;overflow:hidden;}
.el-layer{position:relative;width:100%;height:100%;}
.section-empty-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:hsl(var(--line-strong));pointer-events:none;}
.sec-add-wrap{display:flex;justify-content:center;}
.add-section-btn{display:inline-flex;align-items:center;gap:.45rem;font-size:.72rem;font-weight:600;letter-spacing:.04em;border:1px dashed hsl(var(--line-strong));border-radius:999px;padding:.45rem 1rem;color:hsl(var(--ink-soft));background:hsl(var(--paper));transition:all .15s;}
.add-section-btn:hover{border-color:hsl(var(--ink));color:hsl(var(--ink));}
.sec-hl{position:absolute;inset:-1.5px;border:1.5px solid transparent;pointer-events:none;transition:border-color .12s;}
.sec-hl.active{border-color:hsl(var(--ink));}
.element-wrapper{position:absolute;cursor:default;}
.element-wrapper:not(.locked):hover .el-hover-ring{opacity:1;}
.el-hover-ring{position:absolute;inset:-1px;border:1px dashed hsl(0 0% 60%);opacity:0;pointer-events:none;transition:opacity .1s;}
.element-wrapper.selected .el-sel-ring{display:block;}
.el-sel-ring{position:absolute;inset:calc(-1 * var(--hz-off,1.5px));border:var(--hz-bw,1.5px) solid #000;display:none;pointer-events:none;z-index:20;}
.resize-handle{position:absolute;width:var(--hsz,9px);height:var(--hsz,9px);background:#fff;border:1.5px solid #000;border-radius:99px;z-index:21;}
.el-content{width:100%;height:100%;position:relative;overflow:hidden;user-select:none;}
.el-content.editing{user-select:text;cursor:text;}
.resize-handle{pointer-events:auto;cursor:nwse-resize;}
.resize-handle[data-dir="n"],.resize-handle[data-dir="s"]{cursor:ns-resize;}
.resize-handle[data-dir="e"],.resize-handle[data-dir="w"]{cursor:ew-resize;}
#sel-overlays{pointer-events:none;}
.marquee-box{pointer-events:none;}
.scope-tag .st-actions{pointer-events:auto;}
.studio-editor-active .toast-region{bottom:74px;}
.guide-line{position:absolute;background:hsl(var(--ink));pointer-events:none;z-index:40;opacity:.5;}
.guide-line.v{width:1px;top:0;bottom:0;}
.guide-line.h{height:1px;left:0;right:0;}
.marquee-box{position:absolute;border:1px solid hsl(var(--ink));background:hsl(var(--ink)/.04);z-index:41;pointer-events:none;}
.align-toolbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:2px;padding:5px 8px;background:hsl(var(--ink)/.95);backdrop-filter:blur(10px);color:hsl(var(--paper));border-radius:11px;box-shadow:0 10px 30px -10px hsl(0 0% 0%/.5);}
.align-toolbar .at-count{font-size:.64rem;font-weight:600;letter-spacing:.03em;margin-right:6px;white-space:nowrap;}
.at-btn{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:hsl(var(--paper)/.85);cursor:pointer;}
.at-btn svg{width:13px;height:13px;}
.at-btn:hover{background:hsl(0 0% 100%/.16);color:#fff;}
.at-sep{width:1px;height:15px;background:hsl(0 0% 100%/.22);margin:0 3px;}
.ctx-menu{position:fixed;z-index:1000;min-width:196px;padding:5px;background:hsl(var(--paper)/.97);backdrop-filter:blur(20px) saturate(160%);border:1px solid hsl(var(--line));border-radius:12px;box-shadow:0 18px 44px -16px hsl(0 0% 0%/.35);animation:pop-in 130ms ease both;}
.ctx-item{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;font-size:.78rem;font-weight:500;padding:.42rem .6rem;border-radius:8px;color:hsl(var(--ink));line-height:1.2;}
.ctx-item:hover{background:hsl(var(--paper-3));}
.ctx-item svg{width:13.5px;height:13.5px;color:hsl(var(--ink-soft));flex:none;}
.ctx-item[data-disabled]{opacity:.35;pointer-events:none;}
.ctx-item.danger svg{color:hsl(var(--ink));}
.ctx-sep{height:1px;background:hsl(var(--line));margin:4px 6px;}
.ctx-kbd{margin-left:auto;display:flex;gap:3px;}
/* Add dock & popup */
.add-dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:55;}
.add-popup{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);width:372px;max-height:46vh;padding:12px;z-index:56;display:flex;flex-direction:column;gap:10px;}
.add-popup[hidden]{display:none !important;}
.inspector[hidden]{display:none !important;}
.font-picker-pop[hidden]{display:none !important;}
.ap-search{position:relative;}
.ap-search input{padding-left:30px;border-radius:999px;background:hsl(var(--paper-2));}
.ap-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:hsl(var(--muted-fg));}
.ap-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto;padding-right:2px;}
.ap-type{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px 9px;border:1px solid hsl(var(--line));border-radius:11px;cursor:pointer;background:hsl(var(--paper));transition:all .13s ease;}
.ap-type:hover{border-color:hsl(var(--ink));transform:translateY(-2px);box-shadow:0 8px 18px -10px hsl(0 0% 0%/.3);}
.ap-type svg{width:17px;height:17px;color:hsl(var(--ink));}
.ap-type span{font-size:.62rem;color:hsl(var(--ink-soft));letter-spacing:.02em;}
.ap-title{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:hsl(var(--muted-fg));display:flex;justify-content:space-between;align-items:center;}
/* Panels (left slide-over) */
.side-panel{position:absolute;top:0;left:0;bottom:0;width:308px;z-index:70;display:flex;flex-direction:column;animation:panel-in .22s cubic-bezier(.2,.9,.3,1) both;}
@keyframes panel-in{from{transform:translateX(-24px);opacity:0;}to{transform:none;opacity:1;}}
.sp-head{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;border-bottom:1px solid hsl(var(--line));flex:none;}

// Migration (legacy page.elements -> sections), ported as-is.
function migrateSite(s) {
  if (!s) return s;
  let changed = false;
  const pages = s.pages.map((p) => {
    if (!p.sections && p.elements) {
      changed = true;
      return { ...p, sections: [newSection({ name: "Section 1", height: p.canvasHeight || 600, background: p.background || { type: "color", value: "#ffffff" }, elements: p.elements })], elements: undefined, canvasHeight: undefined, background: undefined };
    }
    if (!p.sections) { changed = true; return { ...p, sections: [newSection({ name: "Section 1", height: 600 })] }; }
    return p;
  });
  if (!s.loadedFonts) { changed = true; s = { ...s, loadedFonts: [] }; }
  if (!s.publishHistory) { changed = true; s = { ...s, publishHistory: [] }; }
  if (!s.header || !s.footer) { changed = true; s = { header: s.header || { show: true, height: 72, background: { type: "color", value: "#ffffff" }, elements: [] }, footer: s.footer || { show: true, height: 100, background: { type: "color", value: "#ffffff" }, elements: [] }, ...s }; }
  return changed ? { ...s, pages } : s;
}

function elementLabel(el) {
  switch (el.type) {
    case "heading": case "text": { const t = stripTags(el.props.html); return t.length > 34 ? t.slice(0, 34) + "…" : t || capitalize(el.type); }

const stripTags = (s = "") => String(s).replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim();

/* ---------------- Mini markdown renderer ---------------- */
function miniMarkdown(src = "") {
  let txt = esc(src.replace(/\r\n/g, "\n"));
  const blocks = [];
  txt = txt.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(`<pre><code>${code}</code></pre>`); return `\u0000B${blocks.length - 1}\u0000`;
  });
  txt = txt.replace(/^###### (.*)$/gm, "<h6>$1</h6>").replace(/^##### (.*)$/gm, "<h5>$1</h5>")
    .replace(/^#### (.*)$/gm, "<h4>$1</h4>").replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^\s*(?:---|\*\*\*)\s*$/gm, "<hr/>")
    .replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  // lists
  txt = txt.replace(/(?:^(?:[-*]) .*(?:\n|$))+/gm, (m) => `<ul>${m.trim().split("\n").map((li) => `<li>${li.replace(/^[-*] /, "")}</li>`).join("")}</ul>`);
  txt = txt.replace(/(?:^\d+\. .*(?:\n|$))+/gm, (m) => `<ol>${m.trim().split("\n").map((li) => `<li>${li.replace(/^\d+\. /, "")}</li>`).join("")}</ol>`);
  const inline = (s) => s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/__([^_]+)__/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = txt.split(/\n{2,}/).map((chunk) => {
    const c = chunk.trim();
    if (!c) return "";
    if (/^<(h\d|ul|ol|blockquote|pre|hr)/i.test(c) || /^\u0000B\d+\u0000$/.test(c)) return inline(c).replace(/\n/g, "<br/>");
    return `<p>${inline(c).replace(/\n/g, "<br/>")}</p>`;
  }).join("\n");
  const out = lines.replace(/\u0000B(\d+)\u0000/g, (_, i) => blocks[Number(i)]);
  return out.replace(/<p><\/p>/g, "");
}

/* ---------------- SVG charts for the chart element ---------------- */
function svgChart(p, w = 380, hgt = 260) {
  const data = (p.data || []).filter((d) => d && d.name != null);
  if (!data.length) return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px">Chart — add data in Inspector</div>';
  const color = p.color || "#000000";
  const max = Math.max(...data.map((d) => Number(d.value) || 0), 1e-9);
  const pad = { l: 30, r: 10, t: 14, b: 26 };
  const iw = w - pad.l - pad.r, ih = hgt - pad.t - pad.b;
  const grid = [0.25, 0.5, 0.75, 1].map((f) =>
    `<line x1="${pad.l}" y1="${pad.t + ih * (1 - f)}" x2="${w - pad.r}" y2="${pad.t + ih * (1 - f)}" stroke="#eee" stroke-width="1"/>` +
    `<text x="${pad.l - 5}" y="${pad.t + ih * (1 - f) + 3}" font-size="9" fill="#999" text-anchor="end">${Math.round(max * f)}</text>`).join("");
  const labels = data.map((d, i) => `<text x="${pad.l + iw * ((i + 0.5) / data.length)}" y="${hgt - 8}" font-size="9.5" fill="#666" text-anchor="middle">${esc(String(d.name)).slice(0, 8)}</text>`).join("");

      if (pages.length === 0) pages = [newPage({ title: "Home", navTitle: "Home", slug: "home", isHome: true, location: "main" })];
      const cur = s.currentPageId === pageId ? pages[0].id : s.currentPageId;
      if (!pages.some((p) => p.isHome && p.location === "main")) pages[0].isHome = true;
      return { ...s, pages, currentPageId: cur };
    });
    Store.set({ selectedIds: [], activeSectionId: (Store.state.sites[activeSiteId].pages[0]?.sections?.[0]?.id) || null });
  },
  duplicatePage(pageId) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => {
      const src = s.pages.find((p) => p.id === pageId); if (!src) return s;
      const copy = JSON.parse(JSON.stringify(src));
      copy.id = uid("pg"); copy.title = src.title + " copy"; copy.slug = src.slug + "-copy"; copy.isHome = false;
      copy.sections = copy.sections.map((sec) => ({ ...sec, id: uid("sec"), elements: sec.elements.map((e) => ({ ...e, id: uid("el") })) }));
      return { ...s, pages: [...s.pages, copy] };
    });
  },
  setPageAsHome(pageId) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, pages: s.pages.map((p) => ({ ...p, isHome: p.id === pageId && p.location === "main" })) }));
  },
  movePageLocation(pageId, location) {
    Actions.updatePage(pageId, (p) => ({ ...p, location, ...(location === "notlinked" ? { isHome: false } : {}) }));
  },

  /* ---------- sections ---------- */
  addSection(over = {}) {
    const { activeSiteId } = Store.state;
    if (!activeSiteId) return;
    const sec = newSection(over);
    Actions.updateSite(activeSiteId, (s) => ({ ...s, pages: s.pages.map((p) => p.id === s.currentPageId ? { ...p, sections: [...p.sections, sec] } : p) }));
    Store.set({ activeSectionId: sec.id, editingScope: "main" });
    return sec.id;
  },
  applyBackgroundToAllSections(bg) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, pages: s.pages.map((p) => p.id === s.currentPageId ? { ...p, sections: p.sections.map((sec) => ({ ...sec, background: bg })) } : p) }));
  },
  syncBackgroundAcrossPages(bg) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, background: bg, pages: s.pages.map((p) => ({ ...p, sections: p.sections.map((sec) => ({ ...sec, background: bg })) })) }));
  },
  updateSection(sectionId, updater) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, pages: s.pages.map((p) => p.id === s.currentPageId ? { ...p, sections: p.sections.map((sec) => sec.id === sectionId ? { ...sec, ...(typeof updater === "function" ? updater(sec) : updater) } : sec) } : p) }));
  },
  removeSection(sectionId) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, pages: s.pages.map((p) => p.id === s.currentPageId ? { ...p, sections: p.sections.filter((sec) => sec.id !== sectionId) } : p) }));
    Store.set({ selectedIds: [] });
    const s = Store.state.sites[activeSiteId]; const page = s.pages.find((p) => p.id === s.currentPageId);
    Store.set({ activeSectionId: page?.sections?.[0]?.id || null });
  },
  duplicateSection(sectionId) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, pages: s.pages.map((p) => {
      if (p.id !== s.currentPageId) return p;
      const src = p.sections.find((x) => x.id === sectionId); if (!src) return p;
      const copy = { ...JSON.parse(JSON.stringify(src)), id: uid("sec"), name: src.name + " copy", elements: src.elements.map((e) => ({ ...e, id: uid("el") })) };
      const idx = p.sections.findIndex((x) => x.id === sectionId);
      const sections = [...p.sections]; sections.splice(idx + 1, 0, copy);
      return { ...p, sections };
    }) }));
  },
  moveSection(sectionId, dir) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, pages: s.pages.map((p) => {
      if (p.id !== s.currentPageId) return p;
      const idx = p.sections.findIndex((x) => x.id === sectionId); if (idx < 0) return p;
      const j = idx + (dir === "up" ? -1 : 1);
      if (j < 0 || j >= p.sections.length) return p;
      const sections = [...p.sections]; [sections[idx], sections[j]] = [sections[j], sections[idx]];
      return { ...p, sections };
    }) }));
  },
  setActiveSection(id) { Store.set({ activeSectionId: id, editingScope: "main" }); },

  /* ---------- elements ---------- */
  addElement(type, x, y, scope, sectionId) {
    const { activeSiteId, activeSectionId } = Store.state;
    const sc = scope || Store.state.editingScope || "main";
    let px = x, py = y;
    if (px == null || py == null) {
      const zone = document.querySelector(sc === "header" ? "[data-scope-host='header']" : sc === "footer" ? "[data-scope-host='footer']" : `[data-section-zone='${sectionId || activeSectionId}'] .el-layer`);
      if (zone) {
        const zr = zone.getBoundingClientRect();
        px = clamp(Math.round(((window.innerWidth / 2) - zr.left) / EditorApi.zoom()) - 120, 24, Math.max(24, zone.offsetWidth - 260));
        py = clamp(Math.round(zr.height / 2 - 40), 20, Math.max(20, zone.offsetHeight - 120));
      } else { px = px ?? 40; py = py ?? 40; }
    }
    const el = newElement(type, px, py);
    if (sc === "main") {
      const sid = sectionId || activeSectionId;
      if (!sid) { ToastHub("Select a section first"); return null; }
      Actions.updateSite(activeSiteId, (s) => mapScopeElements(s, "main", (list) => [...list, el], sid));
    } else {
      Actions.updateSite(activeSiteId, (s) => mapScopeElements(s, sc, (list) => [...list, el]));
    }
    Store.set({ selectedIds: [el.id] });
    return el.id;
  },
  updateElement(elId, updater, opts = {}) {
    const { activeSiteId, sites } = Store.state;
    const loc = locate(sites[activeSiteId], elId); if (!loc) return;
    Actions.updateSite(activeSiteId, (s) => mapScopeElements(s, loc.scope, (list) => list.map((e) => e.id === elId ? { ...e, ...(typeof updater === "function" ? updater(e) : updater) } : e), loc.sectionId), opts);
  },
  updateElementProps(elId, patch, opts) { Actions.updateElement(elId, (e) => ({ props: { ...e.props, ...patch } }), opts); },
  removeElements(ids) {
    const { activeSiteId, sites } = Store.state;
    const site = sites[activeSiteId]; if (!site) return;
    const buckets = {};
    ids.forEach((id) => { const l = locate(site, id); if (l) { const key = l.scope + ":" + (l.sectionId || ""); (buckets[key] = buckets[key] || { loc: l, ids: [] }).ids.push(id); } });
    Actions.updateSite(activeSiteId, (s) => {
      let next = s;
      Object.values(buckets).forEach(({ loc, ids: arr }) => { next = mapScopeElements(next, loc.scope, (list) => list.filter((e) => !arr.includes(e.id)), loc.sectionId); });
      return next;
    });
    Store.set({ selectedIds: [] });
  },
  duplicateElements(ids) {
    const { activeSiteId, sites } = Store.state;
    const site = sites[activeSiteId]; if (!site) return;
    const newIds = [];
    const buckets = {};
    ids.forEach((id) => { const l = locate(site, id); if (l) { const key = l.scope + ":" + (l.sectionId || ""); (buckets[key] = buckets[key] || { loc: l, ids: [] }).ids.push(id); } });
    Actions.updateSite(activeSiteId, (s) => {
      let next = s;
      Object.values(buckets).forEach(({ loc, ids: arr }) => {
        next = mapScopeElements(next, loc.scope, (list) => {
          const cloned = list.filter((e) => arr.includes(e.id)).map((e) => { const c = JSON.parse(JSON.stringify(e)); c.id = uid("el"); c.x += 24; c.y += 24; c.groupId = null; newIds.push(c.id); return c; });
          return [...list, ...cloned];
        }, loc.sectionId);
      });
      return next;
    });
    Store.set({ selectedIds: newIds });
  },
  bringToFront(elId) {
    const { activeSiteId, sites } = Store.state;
    const loc = locate(sites[activeSiteId], elId); if (!loc) return;
    Actions.updateSite(activeSiteId, (s) => mapScopeElements(s, loc.scope, (list) => {
      const maxZ = Math.max(0, ...list.map((e) => e.zIndex || 0));
      return list.map((e) => e.id === elId ? { ...e, zIndex: maxZ + 1 } : e);
    }, loc.sectionId));
  },
  sendToBack(elId) {
    const { activeSiteId, sites } = Store.state;
    const loc = locate(sites[activeSiteId], elId); if (!loc) return;
    Actions.updateSite(activeSiteId, (s) => mapScopeElements(s, loc.scope, (list) => {
      const minZ = Math.min(0, ...list.map((e) => e.zIndex || 0));
      return list.map((e) => e.id === elId ? { ...e, zIndex: minZ - 1 } : e);
    }, loc.sectionId));
  },
  setLocked(elId, locked) { Actions.updateElement(elId, () => ({ locked }), { history: false }); },
  setHidden(elId, hidden) { Actions.updateElement(elId, () => ({ hidden }), { history: false }); },

  /* ---------- groups ---------- */
  groupSelection() {
    const { selectedIds } = Store.state; if (selectedIds.length < 2) return;
    const groupId = uid("grp");
    selectedIds.forEach((id) => Actions.updateElement(id, () => ({ groupId }), { history: false }));
    Actions.updateElement(selectedIds[0], (e) => ({ groupId }), {});
  },
  ungroupSelection() {
    const { selectedIds } = Store.state;
    selectedIds.forEach((id) => Actions.updateElement(id, () => ({ groupId: null }), { history: false }));
    Actions.updateElement(selectedIds[0], (e) => ({ groupId: null }), {});
  },
  _expandGroupSelection(ids) {
    const { activeSiteId, sites } = Store.state;
    const site = sites[activeSiteId]; if (!site) return ids;
    const result = new Set(ids);
    const groupIds = new Set();
    const walk = (list) => list.forEach((e) => { if (e.groupId && ids.includes(e.id)) groupIds.add(e.groupId); });
    walk(site.header.elements || []); walk(site.footer.elements || []);
    site.pages.forEach((p) => p.sections?.forEach((sec) => walk(sec.elements)));
    const collect = (list) => list.forEach((e) => { if (e.groupId && groupIds.has(e.groupId)) result.add(e.id); });
    collect(site.header.elements || []); collect(site.footer.elements || []);
    site.pages.forEach((p) => p.sections?.forEach((sec) => collect(sec.elements)));
    return Array.from(result);
  },

  /* ---------- align ---------- */
  alignSelection(mode) {
    const { activeSiteId, sites, selectedIds } = Store.state;
    const site = sites[activeSiteId]; if (!site || selectedIds.length < 2) return;
    const buckets = {};
    selectedIds.forEach((id) => { const l = locate(site, id); if (l) { const k = l.scope + ":" + (l.sectionId || ""); (buckets[k] = buckets[k] || { loc: l, ids: [] }).ids.push(id); } });
    Actions.updateSite(activeSiteId, (s) => {
      let next = s;
      Object.values(buckets).forEach(({ loc, ids }) => {
        if (ids.length < 2) return;
        next = mapScopeElements(next, loc.scope, (list) => {
          const sel = list.filter((e) => ids.includes(e.id));
          const minX = Math.min(...sel.map((e) => e.x));
          const maxX = Math.max(...sel.map((e) => e.x + e.width));
          const minY = Math.min(...sel.map((e) => e.y));
          const maxY = Math.max(...sel.map((e) => e.y + e.height));
          const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
          const transform = (e) => {
            switch (mode) {
              case "left": return { ...e, x: minX };
              case "right": return { ...e, x: maxX - e.width };
              case "hcenter": return { ...e, x: cx - e.width / 2 };
              case "top": return { ...e, y: minY };
              case "bottom": return { ...e, y: maxY - e.height };
              case "vcenter": return { ...e, y: cy - e.height / 2 };
              default: return e;
            }
          };
          if (mode === "distH" || mode === "distV") {
            if (sel.length < 3) return list;
            const sorted = [...sel].sort((a, b) => mode === "distH" ? a.x - b.x : a.y - b.y);
            const first = sorted[0], last = sorted[sorted.length - 1];
            const total = mode === "distH" ? (last.x - first.x) : (last.y - first.y);
            const step = total / (sorted.length - 1);
            return list.map((e) => { const i = sorted.findIndex((x) => x.id === e.id); if (i <= 0 || i >= sorted.length - 1) return e; return mode === "distH" ? { ...e, x: first.x + step * i } : { ...e, y: first.y + step * i }; });
          }
          return list.map((e) => ids.includes(e.id) ? transform(e) : e);
        }, loc.sectionId);
      });
      return next;
    });
  },

  /* ---------- selection ---------- */
  select(ids, additive = false) {
    const { activeSiteId, sites } = Store.state;
    const site = sites[activeSiteId];
    let expanded = ids;
    if (site && ids.length) expanded = Actions._expandGroupSelection(ids);
    Store.set((st => ({ selectedIds: additive ? Array.from(new Set([...st.selectedIds, ...expanded])) : expanded }))(Store.state));
    if (site && expanded.length) {
      const loc = locate(site, expanded[0]);
      if (loc) Store.set({ editingScope: loc.scope, activeSectionId: loc.sectionId || Store.state.activeSectionId });
    }
  },
  clearSelection() { Store.set({ selectedIds: [] }); },
  setEditingScope(scope) {
    Store.set({ editingScope: scope, selectedIds: [] });
    if (scope === "main") {
      const s = Store.state.sites[Store.state.activeSiteId]; const p = s?.pages.find((x) => x.id === s.currentPageId);
      Store.set({ activeSectionId: p?.sections?.[0]?.id || null });
    }
  },

  /* ---------- clipboard ---------- */
  copySelection() {
    const { activeSiteId, sites, selectedIds } = Store.state;
    const site = sites[activeSiteId]; if (!site) return;
    const items = selectedIds.map((id) => {
      const loc = locate(site, id); if (!loc) return null;
      const list = getElementList(site, loc); if (!list) return null;
      return list.find((e) => e.id === id);
    }).filter(Boolean);
    if (!items.length) return;
    Store.set({ clipboard: JSON.stringify(items) }, { silent: true });
    ToastHub(items.length === 1 ? "Copied 1 element" : `Copied ${items.length} elements`);
  },
  pasteClipboard() {
    const { clipboard, activeSiteId, editingScope, activeSectionId } = Store.state;
    if (!clipboard) return;
    const els = JSON.parse(clipboard);
    const newIds = [];
    const targetScope = editingScope === "main" ? "main" : editingScope;
    Actions.updateSite(activeSiteId, (s) => mapScopeElements(s, targetScope, (list) => {
      const cloned = els.map((e) => { const c = { ...JSON.parse(JSON.stringify(e)), id: uid("el"), x: (e.x || 0) + 24, y: (e.y || 0) + 24 }; c.groupId = null; newIds.push(c.id); return c; });
      return [...list, ...cloned];
    }, targetScope === "main" ? activeSectionId : undefined));
    if (newIds.length) Store.set({ selectedIds: newIds });
  },

  /* ---------- undo/redo ---------- */
  undo() {
    const { activeSiteId, sites } = Store.state;
    if (historyState.siteId !== activeSiteId || historyState.past.length === 0) return;
    const s = sites[activeSiteId];
    const prev = historyState.past.pop();
    historyState.future.push(JSON.stringify(s));
    const parsed = JSON.parse(prev);
    const sites2 = { ...sites, [activeSiteId]: parsed };
    Store.set({ sites: sites2 }); scheduleSave();
    Store.set({ selectedIds: [] });
  },
  redo() {
    const { activeSiteId, sites } = Store.state;
    if (historyState.siteId !== activeSiteId || historyState.future.length === 0) return;
    const s = sites[activeSiteId];
    const nxt = historyState.future.pop();
    historyState.past.push(JSON.stringify(s));
    const parsed = JSON.parse(nxt);
    const sites2 = { ...sites, [activeSiteId]: parsed };
    Store.set({ sites: sites2 }); scheduleSave();
    Store.set({ selectedIds: [] });
  },
  canUndo() { return historyState.siteId === Store.state.activeSiteId && historyState.past.length > 0; },
  canRedo() { return historyState.siteId === Store.state.activeSiteId && historyState.future.length > 0; },

  /* ---------- ui ---------- */
  openPanelFn(name, data = null) { Store.set({ openPanel: name, panelData: data }); },
  closePanel() { Store.set({ openPanel: null, panelData: null }); },
  setDialog(d) { Store.set({ dialog: d }); },
  closeDialog() { Store.set({ dialog: null }); },
  setContextMenu(cm) { Store.set({ contextMenu: cm }); },
  setPreview(mode) { Store.set({ previewMode: mode }); },
  setZoom(z) { Store.set({ zoom: clamp(+z.toFixed(3), 0.25, 3) }); },
  toggleGrid() { Store.set((st => ({ showGrid: !st.showGrid }))(Store.state)); },
  toggleGuides() { Store.set((st => ({ showGuides: !st.showGuides }))(Store.state)); },
  toggleSnap() { Store.set((st => ({ snap: !st.snap }))(Store.state)); },
  copyStyle(elId) {
    const { activeSiteId, sites } = Store.state;
    const site = sites[activeSiteId]; if (!site) return;
    const loc = locate(site, elId); if (!loc) return;
    const list = getElementList(site, loc); if (!list) return;
    const el = list.find((e) => e.id === elId); if (!el) return;
    Store.set({ copiedStyle: { type: el.type, props: el.props, style: el.style } }, { silent: true });
    ToastHub("Style copied");
  },
  pasteStyle(elId) {
    const { copiedStyle } = Store.state; if (!copiedStyle) return;
    Actions.updateElement(elId, (e) => ({ props: { ...e.props, ...copiedStyle.props }, style: { ...e.style, ...copiedStyle.style } }));
  },

  /* ---------- media ---------- */
  addToGallery(item) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, gallery: [{ ...item, id: uid("g"), createdAt: Date.now() }, ...(s.gallery || [])] }), { history: false });
  },
  removeFromGallery(gid) {
    const { activeSiteId } = Store.state;
    Actions.updateSite(activeSiteId, (s) => ({ ...s, gallery: (s.gallery || []).filter((g) => g.id !== gid) }), { history: false });
  },
  getElementScope(id) { const s = Store.state.sites[Store.state.activeSiteId]; return locate(s, id)?.scope || "main"; },
};

/* ---------- shares registry ---------- */
const ShareStore = {
  put(snapshot) {
    const id = uid("sh");
    const shares = { ...Store.state.shares, [id]: snapshot };
    try { localStorage.setItem(LS_SHARES, JSON.stringify(shares)); } catch (e) { console.warn("share save failed", e); return null; }
    Store.set({ shares });
    return id;
  },
  get(id) { return Store.state.shares[id] || null; },
};

/* Reactive helper for simple views */
function useStoreRender(renderFn, rootEl) {
  renderFn(Store.state);
  Store.sub(() => renderFn(Store.state));
  void rootEl;
}

</script>
<script>
/* =================================================================
   Part 4: Element rendering (live canvas DOM) + standalone HTML
   exporter (ported from src/lib/exporter.js).
   ================================================================= */

/* --- Live canvas DOM node for one element's INNER content (no wrapper). --- */
function renderElementContent(el, opts = {}) {
  const p = el.props || {};
  const editable = !!opts.editable;
  let node;
  switch (el.type) {
    case "heading":
    case "text": {
      const tag = el.type === "heading" ? (p.tag || "h1") : "div";
      const styleText = `font-family:${p.fontFamily};font-size:${p.fontSize}px;font-weight:${p.fontWeight};line-height:${p.lineHeight};letter-spacing:${p.letterSpacing}px;color:${p.color};text-align:${p.textAlign};padding:${p.padding}px;${bgCss(p.background)}width:100%;height:100%;box-sizing:border-box;overflow:hidden;margin:0;`;
      const inner = h(tag, { style: styleText });
      if (editable) {
        inner.setAttribute("contenteditable", "true");
        try { inner.innerHTML = p.html || ""; } catch { inner.textContent = stripTags(p.html); }
        inner.classList.add("ce-target");
      } else {
        inner.innerHTML = p.html || "";
      }
      node = inner;
      break;
    }
    case "image": {
      const f = p.filters || {};
      const filterCss = `filter:blur(${f.blur||0}px) grayscale(${(f.grayscale||0)}) sepia(${(f.sepia||0)}) brightness(${f.brightness||1}) contrast(${f.contrast||1}) saturate(${f.saturate||1}) hue-rotate(${f.hueRotate||0}deg) invert(${f.invert||0});`;
      const wrap = h("div", { style: "width:100%;height:100%;display:flex;flex-direction:column;" });
      if (!p.src) {
        const dz = h("label", { class: "upload-drop img-drop", style: "flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:0;cursor:pointer;" },
          icon("image"), h("span", {}, "Add image"), h("span", { style: "font-size:.62rem;opacity:.7" }, "click to upload · paste URL in Inspector"));
        const inp = h("input", { type: "file", accept: "image/*" });
        inp.addEventListener("change", async () => { if (inp.files[0]) await fileToGalleryAndSet(inp.files[0], el.id); });
        dz.appendChild(inp);
        if (!editable) { dz.textContent = "Image"; }
        wrap.appendChild(dz);
      } else {
        const img = h("img", { src: p.src, alt: p.alt || "", draggable: "false",
          style: `width:100%;flex:1;min-height:0;object-fit:${p.fit};object-position:${(p.focal?.x||0.5)*100}% ${(p.focal?.y||0.5)*100}%;border-radius:${p.radius}px;opacity:${p.opacity};${filterCss}transform:scaleX(${p.flipX?-1:1}) scaleY(${p.flipY?-1:1});display:block;` });
        wrap.appendChild(img);
      }
      if (p.caption && p.src) wrap.appendChild(h("div", { style: "font-size:12px;color:#666;margin-top:4px;text-align:center;flex:none;" }, p.caption));
      node = wrap;
      break;
    }
    case "video": {
      if (p.source === "youtube" && p.src) {
        const idm = p.src.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
        const id = idm ? idm[1] : p.src;
        node = h("iframe", { src: `https://www.youtube.com/embed/${id}${p.autoplay ? "?autoplay=1&mute=1" : ""}`, style: "width:100%;height:100%;border:0;border-radius:12px;", allowfullscreen: true, draggable: "false" });
      } else if (p.source === "vimeo" && p.src) {
        const idm = p.src.match(/vimeo\.com\/(\d+)/);
        const id = idm ? idm[1] : p.src;
        node = h("iframe", { src: `https://player.vimeo.com/video/${id}${p.autoplay ? "?autoplay=1&muted=1" : ""}`, style: "width:100%;height:100%;border:0;border-radius:12px;", allowfullscreen: true, draggable: "false" });
      } else {
        const v = h("video", { src: p.src || "", playsinline: true, style: "width:100%;height:100%;object-fit:cover;border-radius:12px;background:#000;display:block;", draggable: "false" });
        if (p.autoplay) v.autoplay = true; if (p.muted !== false) v.muted = true;
        if (p.loop) v.loop = true; if (p.controls) v.controls = true;
        if (p.poster) v.poster = p.poster;
        if (!p.src && editable) {
          node = makeUploadZone(el.id, "video/*", "video");
        } else node = v;
      }
      break;
    }
    case "audio": {
      if (!p.src && editable) { node = makeUploadZone(el.id, "audio/*", "audio"); break; }

/* ---- Calendar widget (interactive month view) ---- */
function buildCalendarWidget(p) {
  const root = h("div", { style: "width:100%;height:100%;background:#fff;border-radius:12px;border:1px solid #eee;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;font-size:.72rem;user-select:none;" });
  const state = { month: new Date().getMonth(), year: new Date().getFullYear(), sel: p.selected || null };
  function draw() {
    root.innerHTML = "";
    const head = h("div", { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600" });
    const monthName = new Date(state.year, state.month, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
    const prevB = iconBtnLite("chevron-left", () => { state.month--; if (state.month < 0) { state.month = 11; state.year--; } draw(); });
    const nextB = iconBtnLite("chevron-right", () => { state.month++; if (state.month > 11) { state.month = 0; state.year++; } draw(); });
    head.append(prevB, h("span", {}, monthName), nextB);
    root.appendChild(head);
    const grid = h("div", { style: "display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;" });
    ["S","M","T","W","T","F","S"].forEach((d) => grid.appendChild(h("div", { style: "text-align:center;color:#999;font-size:9px;padding:3px 0;" }, d)));
    const firstDay = new Date(state.year, state.month, 1).getDay();
    const daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) grid.appendChild(h("div"));
    for (let day = 1; day <= daysInMonth; day++) {
      const iso = `${state.year}-${String(state.month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const isSel = typeof p.selected === "string" ? p.selected === iso : Array.isArray(p.selected) && p.selected.includes(iso);
      const cell = h("div", { style: `display:flex;align-items:center;justify-content:center;border-radius:7px;aspect-ratio:1;cursor:pointer;background:${isSel ? "#000" : "transparent"};color:${isSel ? "#fff" : "#222"};transition:background .12s` }, String(day));
      cell.addEventListener("click", (e) => {
        e.stopPropagation(); if (!EditorApi?.isActive) return void 0;
        if (typeof p.selected === "string" || p.selected == null) { p.selected = isSel ? null : iso; }
        else if (Array.isArray(p.selected)) { const ix = p.selected.indexOf(iso); if (ix >= 0) p.selected.splice(ix, 1); else p.selected.push(iso); }
        if (elRootOwner(root)) Store.emit();
        draw();
      });
      grid.appendChild(cell);
    }
    root.appendChild(grid);
  }
  draw();
  return root;
}
function elRootOwner(node) { return !!node.closest(".editor-root"); }

  b.appendChild(icon(name)); b.addEventListener("click", (e) => { e.stopPropagation(); onClick(); });

      inner = `<div style="display:flex;gap:${p.gap ?? 12}px;align-items:center;height:100%">` + p.items.map((it) => `<a href="${esc(it.url||'#')}" target="_blank" rel="noopener" style="color:${p.color};font-size:${p.size}px;text-decoration:none;font-weight:600;font-family:'JetBrains Mono',monospace">${iconsMap[it.platform] || String(it.platform || '').slice(0,2).toUpperCase()}</a>`).join("") + `</div>`;
      break;
    }
    case "search":
      inner = `<form style="width:100%;height:100%"><input type="search" placeholder="${esc(p.placeholder)}" style="width:100%;height:100%;padding:0 16px;border-radius:${p.radius}px;border:1px solid #ddd;color:${p.color};font-family:inherit;box-sizing:border-box"/></form>`;
      break;
    case "calendar":
      inner = exportCalendarHTML(p);
      break;
    case "chart":
      inner = `<div style="width:100%;height:100%;background:#fff;border-radius:12px;border:1px solid #eee;padding:10px;box-sizing:border-box">${svgChart(p, el.width, el.height)}</div>`;
      break;
    case "container":
      inner = `<div style="width:100%;height:100%;border-radius:${p.radius}px;padding:${p.padding}px;box-sizing:border-box;${bgCss(p.background)}"></div>`;
      break;
    default:
      inner = "";
  }
  return openWrap + inner + closeWrap;
}

function exportCalendarHTML(p) {
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();
  const monthName = new Date(y, mo, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
  const firstDay = new Date(y, mo, 1).getDay();
  const dim = new Date(y, mo + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < firstDay; i++) cells += "<span></span>";
  for (let d = 1; d <= dim; d++) cells += `<span style="display:flex;align-items:center;justify-content:center;border-radius:6px;">${d}</span>`;
  return `<div style="width:100%;height:100%;background:#fff;border-radius:12px;border:1px solid #eee;padding:12px;box-sizing:border-box;font-size:12px">
<div style="font-weight:700;margin-bottom:8px;font-size:13px">${monthName}</div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;color:#999;text-align:center">
<span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
${cells}
</div></div>`;
}

function exportPageHTML(page, site) {
  const headerHtml = site.header.show && page.showHeader
    ? `<header style="position:relative;width:100%;height:${site.header.height}px;${bgCss(site.header.background)};overflow:hidden">${(site.header.elements||[]).map((e) => exportElementHTML(e)).join("")}</header>`
    : "";
  const footerHtml = site.footer.show && page.showFooter
    ? `<footer style="position:relative;width:100%;height:${site.footer.height}px;${bgCss(site.footer.background)};overflow:hidden">${(site.footer.elements||[]).map((e) => exportElementHTML(e)).join("")}</footer>`
    : "";
  const sectionsHtml = (page.sections || []).map((sec) =>
    `<section style="position:relative;width:100%;height:${sec.height}px;${bgCss(sec.background)};overflow:hidden">${sec.elements.map((e) => exportElementHTML(e)).join("")}</section>`).join("");
  return `${headerHtml}${sectionsHtml}${footerHtml}${page.inject?.body || ""}`;
}

function fontLinksFor(site) {
  const fams = new Set([site.theme?.display || "Fraunces", site.theme?.body || "DM Sans"]);
  (site.loadedFonts || []).forEach((f) => fams.add(f));
  return [...fams].map((f) => `<link href="https://fonts.googleapis.com/css2?family=${f.replace(/ /g,'+')}:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>`).join("\n");
}

function exportSiteHTML(site) {
  const home = site.pages.find((p) => p.isHome) || site.pages[0];
  const pagesBlocks = site.pages.filter((p) => p.kind !== "link").map((p) => {
    const width = p.canvasWidth || 1280;
    const totalHeight = (site.header.show && p.showHeader ? site.header.height : 0)
      + p.sections.reduce((a, sec) => a + sec.height, 0)
      + (site.footer.show && p.showFooter ? site.footer.height : 0);
    return `
    <section id="page-${esc(p.slug)}" data-page-id="${p.id}" style="display:${p.id === home.id ? 'block' : 'none'};width:100%;">
      ${p.password ? `<script>(function(){function pw(){var k="${esc(p.slug)}_pw";if(sessionStorage.getItem(k)!=="1"){var v=prompt("Password required for ${esc(p.title)}");if(v!=="${esc(p.password)}"){document.getElementById('page-${esc(p.slug)}').innerHTML='<div style="padding:80px;text-align:center;font-family:sans-serif">Wrong password.</div>';}else{sessionStorage.setItem(k,"1")}}}setTimeout(pw,0);})();<\/script>` : ""}
      <div style="width:${width}px;max-width:100%;margin:0 auto;position:relative;min-height:${totalHeight}px;">${exportPageHTML(p, site)}</div>
    </section>`;
  }).join("");

  const routerScript = `
<script>
(function(){
document.querySelectorAll('a[data-page]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var t=a.getAttribute('data-page');document.querySelectorAll('section[data-page-id]').forEach(function(s){s.style.display=s.getAttribute('data-page-id')===t?'block':'none';});window.scrollTo(0,0);});});
document.querySelectorAll('form').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();var ok=f.querySelector('.__form-ok');if(ok)ok.style.display='block';});});
})();
<\/script>`;

  const seo = home.seo || {};
  const doc = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>${esc(seo.title || site.name || 'Site')}</title>
<meta name="description" content="${esc(seo.description || '')}"/>
${seo.ogImage ? `<meta property="og:image" content="${esc(seo.ogImage)}"/>` : ''}
${site.favicon ? `<link rel="icon" href="${esc(site.favicon)}"/>` : ''}
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
${fontLinksFor(site)}
<style>
${exportKeyframesBlock()}
:root{--display:'${site.theme?.display||'Fraunces'}',serif;--body:'${site.theme?.body||'DM Sans'}',sans-serif;--accent:${site.theme?.accent||'#000000'};--ink:${site.theme?.ink||'#000000'};--paper:${site.theme?.paper||'#ffffff'};}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--body),sans-serif;color:var(--ink);${bgCss(site.background)}}
a{color:var(--accent)}
</style>
${home.inject?.header || ""}
</head>
<body>
${pagesBlocks}
${routerScript}
${home.inject?.footer || ""}
</body>
</html>`;
  return doc;
}

function downloadHTML(site) {
  const html = exportSiteHTML(site);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${(site.name || 'site').replace(/[^\w\- ]+/g, "").trim() || 'site'}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  return html.length;
}

/* ---------------- Google font helpers ---------------- */
const FONT_CATALOG = [
  "Alegreya","Anton","Archivo","Abril Fatface","Bebas Neue","Bitter","Caveat","Chivo Mono","Cormorant Garamond",
  "DM Sans","EB Garamond","Fira Code","Fira Sans","Fraunces","IBM Plex Mono","IBM Plex Sans","IBM Plex Serif",
  "Instrument Serif","Inter","Josefin Sans","Jost","Lora","Libre Baskerville","Manrope","Merriweather","Montserrat",
  "Nunito","Oswald","Outfit","Playfair Display","Poppins","PT Serif","Raleway","Rubik","Sora","Space Grotesk",
  "Source Serif 4","Syne","Work Sans","Karla","Mulish","Quicksand","Unbounded","Bodoni Moda","Crimson Pro",
  "Newsreader","Petrona","Public Sans","Libre Franklin",
];
function ensureFontLink(family) {
  if (!family || family.startsWith("var(")) return;
  const id = "gfont-" + family.replace(/\s+/g, "-").toLowerCase();
  if (document.getElementById(id)) return;
  const link = document.createElement("link");
  link.rel = "stylesheet"; link.id = id;
  link.href = `https://fonts.googleapis.com/css2?family=${family.replace(/ /g, "+")}:wght@300;400;500;600;700;800&display=swap`;
  document.head.appendChild(link);
}

<script>
/* =================================================================
   Part 5: Hash router + Landing view + Sites dashboard.

const AppRoot = () => document.getElementById("app");

/* ---------- router ---------- */
function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  return { path, parts, raw };
}
function navigate(hash) {
  if (location.hash === hash) { renderRoute(); return; }
  location.hash = hash;
}

let currentViewCleanup = null;
function renderRoute() {
  document.querySelectorAll(".modal-overlay,.ctx-menu,.preview-shell").forEach((n) => n.remove());
  if (typeof currentViewCleanup === "function") { try { currentViewCleanup(); } catch {} currentViewCleanup = null; }
  const app = AppRoot();
  const { parts, raw } = parseHash();
  Store.set({ selectedIds: [], openPanel: null, dialog: null }, { silent: true });
  if (parts[0] === undefined) {
    storeActiveSite(null);
    currentViewCleanup = LandingView(app);
  } else if (parts[0] === "sites") {
    storeActiveSite(null);
    currentViewCleanup = SitesView(app);
  } else if (parts[0] === "editor" && parts[1]) {
    currentViewCleanup = EditorView(app, decodeURIComponent(parts[1]));
  } else if (parts[0] === "share") {
    const idx = raw.indexOf("share/");
    currentViewCleanup = ShareView(app, idx >= 0 ? raw.slice(idx + 6) : decodeURIComponent(parts.slice(1).join("/")));
  } else {
    currentViewCleanup = LandingView(app);
  }
  window.scrollTo(0, 0);
}
function storeActiveSite(id) {
  Store.set({ activeSiteId: id, editingScope: "main", previewMode: null, zoom: 1, showGrid: false, snap: true, activeSectionId: null }, { silent: true });
}
window.addEventListener("hashchange", renderRoute);

/* ================= LANDING ================= */
function LandingView(root) {

        h("div", { class: "mi-row" }, h("span", {}, "Size"), h("b", {}, "56")),

  const hero = h("section", { class: "hero fade-in" },

    h("p", { class: "lede" }, "Drag sections and elements onto an infinite-feeling canvas, style every pixel in a floating inspector, manage pages and media — then export the whole thing as one self-contained HTML file. Everything is stored right here in your browser."),
    h("div", { class: "cta-row" },
      h("button", {
        class: "cta-big",
        onclick: async () => {
          const id = Actions.createSite("Untitled site");
          ToastHub("New site created");
          navigate("#/editor/" + id);
        },
      }, "Get started", icon("chevron-right")),
      hasSites
        ? h("button", { class: "cta-ghost", onclick: () => navigate("#/sites") }, "My sites", h("span", { class: "kbd" }, String(sitesCount)))
        : h("span", { class: "hint", style: "align-self:center;font-size:.78rem;color:hsl(0 0% 45%);" }, "No account. No setup. Just open and build.")
    )
  );
  const features = h("section", { class: "features" },

    featureItem("02", "Structure like a pro", "Reusable header and footer scopes, unlimited pages with Main navigation vs Not linked routing, per-page SEO, password protection and code injection tabs."),

        hasSites
          ? h("button", { class: "pill-btn", onclick: () => navigate("#/sites") }, icon("folder-open"), "My sites")
          : h("button", { class: "pill-btn", onclick: () => document.querySelector(".cta-big")?.click() }, icon("plus"), "Start")
      ),
      hero,
      h("div", { class: "land-stage pop-in" }, mock),
      features,
      h("footer", { class: "land-foot" },
        h("span", {}, "Studio — single-file build"),
        h("span", { class: "font-mono" }, "v" + STUDIO_VERSION)
      )

  );

  function featureItem(num, title, body) {
    return h("div", { class: "feature" },

  }
  return null;
}

/* ================= SITES DASHBOARD ================= */
function SitesView(root) {
  root.innerHTML = "";
  let localOrder = JSON.parse(localStorage.getItem("studio.ui.order") || "[]");
  function listSites() {
    const entries = Object.values(Store.state.sites);
    if (!localOrder.length) return entries.sort((a, b) => b.updatedAt - a.updatedAt);
    const rank = new Map(localOrder.map((id, i) => [id, i]));
    return entries.sort((a, b) => (rank.has(a.id) ? rank.get(a.id) : 9999) - (rank.has(b.id) ? rank.get(b.id) : 9999) || b.updatedAt - a.updatedAt);
  }

  const gridWrap = h("div", {});

  function drawGrid() {
    gridWrap.innerHTML = "";
    const sites = listSites();
    const titleRow = h("div", { style: "display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:.8rem;" },
      h("div", {},
        h("h2", { class: "sites-title" }, "Your sites", h("span", { class: "sites-count" }, sites.length ? `${sites.length} ${sites.length === 1 ? "site" : "sites"}` : "")),
        h("p", { style: "color:hsl(var(--ink-soft));font-size:.82rem;margin-top:.35rem;" }, "Everything on this page lives in this browser's storage only.")
      ),
      h("button", { class: "pill-btn pill-btn-primary", onclick: () => createSiteDialog(), "data-testid": "btn-new-site" }, icon("plus"), "New site")
    );

    const grid = h("div", { class: "sites-grid" });

      h("div", { style: "font-weight:600;font-size:.85rem;" }, "Create a new site"),
      h("div", { style: "font-size:.72rem;" }, "Start from a blank canvas")));
    sites.forEach((s) => {
      const pagesMain = s.pages.filter((p) => p.location === "main").length;
      const pageCount = s.pages.length;
      const elCount = s.pages.reduce((a, p) => a + p.sections.reduce((x, sec) => x + sec.elements.length, 0), 0)
        + s.header.elements.length + s.footer.elements.length;
      const card = h("div", { class: "site-card", "data-testid": `site-card-${s.id}`, onclick: () => navigate("#/editor/" + s.id) },
        h("div", {},
          h("div", { class: "sc-name" }, s.name || "Untitled site"),
          h("div", { class: "sc-meta", style: "margin-top:.55rem;" },
            h("span", {}, `${pageCount} ${pageCount === 1 ? "page" : "pages"}`),
            h("span", {}, "·"),
            h("span", {}, `${elCount} elements`),
            h("span", {}, "·"),
            h("span", {}, fmtDate(s.updatedAt))
          )
        ),
        h("div", { class: "sc-actions", onclick: (e) => e.stopPropagation() },
          h("button", { class: "icon-btn", title: "Open editor", "data-testid": `site-open-${s.id}`, onclick: () => navigate("#/editor/" + s.id) }, icon("pencil")),
          h("button", { class: "icon-btn", title: "Download HTML", onclick: () => { const size = downloadHTML(s); ToastHub(`Exported (${Math.round(size / 1024)} KB)`); } }, icon("download")),

          h("button", { class: "icon-btn", title: "Duplicate", onclick: () => { Actions.duplicateSite(s.id); ToastHub("Duplicated"); drawGrid(); } }, icon("duplicate")),
          h("button", { class: "icon-btn", title: "Delete", "data-testid": `site-delete-${s.id}`, onclick: (e) => confirmModal({
            title: "Delete site?", body: `"${esc(s.name)}" will be permanently removed from browser storage.`,
            confirmLabel: "Delete",
            onConfirm: () => { Actions.deleteSite(s.id); ToastHub("Site deleted"); drawGrid(); }
          }) }, icon("trash"))

      grid.appendChild(card);

    }

  root.appendChild(h("div", { class: "sites-root" },
    h("header", { class: "sites-head" },
      h("div", { class: "wordmark", style: "cursor:pointer;", onclick: () => navigate("#/") }, h("span", { class: "dot" }), "Studio"),
      h("button", { class: "pill-btn", onclick: () => navigate("#/") }, icon("arrow-left"), "Home")
    ),

  ));

  function createSiteDialog() {

    promptModal({

  }
  return null;
}

/* ---------- shared tiny modals (prompt / confirm) ---------- */
function modalShell({ title, bodyEl, okLabel = "OK", cancelLabel = "Cancel", slim = true, okClass = "pill-btn-primary", onOk, hideCancel }) {
  const overlay = h("div", { class: "modal-overlay", onclick: (e) => { if (e.target === overlay) close(); } });
  const close = () => overlay.remove();
  const footRight = [
    ...(hideCancel ? [] : [h("button", { class: "pill-btn", onclick: close }, cancelLabel)]),
    h("button", { class: "pill-btn " + okClass, onclick: () => { if (onOk?.(close) !== false && !overlay.dataset.keepOpen) close(); } }, okLabel),
  ];
  const box = h("div", { class: "modal float-panel" + (slim ? " slim" : ""), role: "dialog", "aria-modal": "true" },
    h("div", { class: "m-head" }, h("div", { class: "m-title" }, title),
      h("button", { class: "icon-btn", onclick: close }, icon("x"))),
    h("div", { class: "m-body" }, bodyEl),
    h("div", { class: "m-foot" }, ...footRight)
  );
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(() => box.querySelector("input,textarea")?.focus(), 40);
  overlay.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.stopPropagation(); close(); }
    if (e.key === "Enter" && e.target.tagName !== "TEXTAREA" && e.target.tagName !== "BUTTON") { e.preventDefault(); onOk?.(close); if (!overlay.dataset.keepOpen) close(); }
  });
  return { close };
}
function promptModal({ title, label, initial = "", placeholder = "", okLabel = "OK", onSubmit, multiline }) {
  const inp = multiline
    ? h("textarea", { rows: "3", value: initial, placeholder })
    : h("input", { value: initial, placeholder });
  const body = h("div", {}, h("label", { class: "fld" }, label), inp);
  modalShell({ title, bodyEl: body, okLabel, slim: true, onOk(close) { onSubmit(inp.value); close(); } });
}
function confirmModal({ title, body, confirmLabel = "Confirm", onConfirm }) {
  const b = h("div", { style: "font-size:.83rem;color:hsl(var(--ink-soft));line-height:1.6;" });
  if (typeof body === "string") b.innerHTML = body; else b.appendChild(body);
  modalShell({ title, bodyEl: b, okLabel: confirmLabel, okClass: "pill-btn-primary", onOk(close) { onConfirm(); close(); } });
}
