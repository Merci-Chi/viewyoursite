<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Preparing Secure Checkout | View Your Site</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
            isolation: isolate;
            background: linear-gradient(145deg, #111 0%, #0e0e0e 48%, #0b0b0b 100%);
            color: #f1f1f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;
            width: min(72vw, 900px);
            aspect-ratio: 1;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(120px);
            transform: translateZ(0);
        }

        body::before {
            top: -42%;
            left: 7%;
            background: rgba(105, 105, 105, 0.18);
        }

        body::after {
            right: -20%;
            bottom: -55%;
            background: rgba(65, 65, 65, 0.12);
        }

        .checkout-card {
            width: min(460px, 100%);
            padding: 2.75rem 2rem 2.25rem;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;
            background: linear-gradient(
                145deg,
                rgba(30, 30, 30, 0.84),
                rgba(20, 20, 20, 0.76)
            );
            box-shadow:
                0 35px 100px rgba(0, 0, 0, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            text-align: center;
        }

        .brand {
            margin-bottom: 2rem;
            color: #d6d6d6;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 1.5rem;
            border: 4px solid #424242;
            border-top-color: #f1f1f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        h1 {
            margin: 0 0 0.8rem;
            font-size: clamp(1.45rem, 5vw, 1.85rem);
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        p {
            margin: 0;
            color: #aaa;
            font-size: 1rem;
            line-height: 1.6;
        }

        .secure-note {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.6rem;
            padding: 0.55rem 0.8rem;
            border: 1px solid #315138;
            border-radius: 999px;
            background: #17251a;
            color: #9bd3a5;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .secure-note::before {
            content: "";
            width: 0.48rem;
            height: 0.48rem;
            border-radius: 50%;
            background: #77c486;
            box-shadow: 0 0 12px rgba(119, 196, 134, 0.5);
        }

        .slow-message {
            min-height: 1.3rem;
            margin-top: 1.25rem;
            color: #858585;
            font-size: 0.82rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
                border-top-color: #77c486;
            }
        }
    </style>
</head>
<body>
    <main class="checkout-card" aria-live="polite">
        <div class="brand">View Your Site</div>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Preparing your secure checkout</h1>
        <p>We’re creating an individual Square subscription checkout for your account.</p>
        <div class="secure-note">Secure payment powered by Square</div>
        <div class="slow-message" id="slowMessage"></div>
    </main>

    <script>
        window.setTimeout(() => {
            document.getElementById("slowMessage").textContent =
                "This is taking a little longer than usual. Please keep this page open.";
        }, 8000);
    </script>
</body>
</html>
