<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Websites · View Your Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem 4rem 1rem;
            position: relative;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 1.5rem;
        }

        /* search row */
        .search-row {
            max-width: 480px;
            margin: 0 auto 2rem auto;
        }

        #searchInput {
            width: 100%;
            padding: 0.75rem 1.2rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        #searchInput:focus {
            border-color: #777;
        }

        #searchInput::placeholder {
            color: #666;
            font-weight: 300;
        }

        /* gallery grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        /* card with iframe preview */
        .site-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            transition: border 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .site-card:hover {
            border-color: #4a4a4a;
            transform: translateY(-3px);
        }

        .preview-frame {
            width: 100%;
            aspect-ratio: 16 / 10;
            border: none;
            background: #1a1a1a;
            display: block;
            pointer-events: none;
        }

        .card-label {
            padding: 0.9rem 0.8rem 0.8rem 0.8rem;
            background: #141414;
            border-top: 1px solid #282828;
            font-size: 0.95rem;
            font-weight: 450;
            letter-spacing: 0.2px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #d0d0d0;
        }

        /* empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1.5rem;
            color: #666;
        }

        .empty-state h2 {
            font-weight: 400;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.95rem;
            color: #555;
        }

        /* ---- bottom-left tilde button ---- */
        .tilde-button {
            position: fixed;
            bottom: 1.8rem;
            left: 1.8rem;
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            color: #b0b0b0;
            font-size: 1.6rem;
            line-height: 1;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            z-index: 900;
            font-family: monospace;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .tilde-button:hover {
            background: #2a2a2a;
            border-color: #5a5a5a;
        }

        /* ---- modal overlay (password & create) ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 20px;
            padding: 2.2rem 2rem 2.5rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal-box h2 {
            font-weight: 400;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
        }

        .modal-box .sub {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 1rem;
        }

        .modal-box label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 0.3rem;
            margin-top: 1rem;
        }

        .modal-box input, 
        .modal-box textarea {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }

        .modal-box input:focus,
        .modal-box textarea:focus {
            border-color: #666;
        }

        .modal-box textarea {
            min-height: 120px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.8rem;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 0.6rem 1.6rem;
            border-radius: 40px;
            border: 1px solid #444;
            background: transparent;
            color: #d0d0d0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .modal-actions button.primary {
            background: #2a2a2a;
            border-color: #5a5a5a;
        }

        .modal-actions button.primary:hover {
            background: #3a3a3a;
            border-color: #7a7a7a;
        }

        .modal-actions button.secondary:hover {
            background: #222;
            border-color: #555;
        }

        .error-msg {
            color: #cf6679;
            font-size: 0.85rem;
            margin-top: 0.6rem;
            min-height: 1.2rem;
        }

        /* password step */
        #passwordStep, #createStep {
            display: block;
        }

        #createStep {
            display: none;
        }

        /* responsive */
        @media (max-width: 700px) {
            h1 { font-size: 2rem; }
            .gallery { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .preview-frame { aspect-ratio: 16 / 11; }
            .card-label { font-size: 0.8rem; padding: 0.6rem 0.4rem; }
            .tilde-button { width: 42px; height: 42px; font-size: 1.4rem; bottom: 1.2rem; left: 1.2rem; }
            .modal-box { padding: 1.8rem 1.5rem; }
        }

        @media (max-width: 480px) {
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Websites</h1>
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Filter websites by name" autocomplete="off">
            </div>
        </header>

        <div class="gallery" id="gallery">
            <!-- cards injected -->
        </div>
    </div>

    <!-- tilde button (bottom-left) -->
    <button class="tilde-button" id="tildeBtn" aria-label="admin panel">~</button>

    <!-- modal overlay: password + create -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <!-- password step -->
            <div id="passwordStep">
                <h2>Access</h2>
                <div class="sub">enter password to continue</div>
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
                <div class="error-msg" id="passwordError"></div>
                <div class="modal-actions">
                    <button class="secondary" id="cancelPwdBtn">Cancel</button>
                    <button class="primary" id="unlockBtn">Unlock</button>
                </div>
            </div>

            <!-- create step (shown after correct password) -->
            <div id="createStep">
                <h2>Add website</h2>
                <div class="sub">enter name and HTML content</div>
                <label for="siteNameInput">Site name</label>
                <input type="text" id="siteNameInput" placeholder="e.g. My New Site" autocomplete="off">

                <label for="htmlContentInput">HTML content</label>
                <textarea id="htmlContentInput" placeholder="<!DOCTYPE html>..."></textarea>

                <div class="error-msg" id="createError"></div>
                <div class="modal-actions">
                    <button class="secondary" id="cancelCreateBtn">Cancel</button>
                    <button class="primary" id="saveSiteBtn">Save & add</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- site data ----------
            let sites = [
            { name: 'Del Carmen Hair Salon', path: 'DelCarmeHairSalon' },
            { name: 'Shop Vezzy', path: 'SHOPVEZZY' },
            { name: 'Studio 47 Hair Salon', path: 'Studio47HairSalon' },
            { name: 'Favorite Place to Shop', path: 'favoriteplacetoshop' },
            { name: 'Green House Water Heaters', path: 'GreenHouseWaterHeaters' }
            ];

            // ---------- DOM refs ----------
            const gallery = document.getElementById('gallery');
            const searchInput = document.getElementById('searchInput');

            // modal
            const modalOverlay = document.getElementById('modalOverlay');
            const tildeBtn = document.getElementById('tildeBtn');
            const passwordStep = document.getElementById('passwordStep');
            const createStep = document.getElementById('createStep');
            const passwordInput = document.getElementById('passwordInput');
            const passwordError = document.getElementById('passwordError');
            const unlockBtn = document.getElementById('unlockBtn');
            const cancelPwdBtn = document.getElementById('cancelPwdBtn');
            const cancelCreateBtn = document.getElementById('cancelCreateBtn');
            const saveSiteBtn = document.getElementById('saveSiteBtn');
            const siteNameInput = document.getElementById('siteNameInput');
            const htmlContentInput = document.getElementById('htmlContentInput');
            const createError = document.getElementById('createError');

            // ---------- hardcoded password ----------
            const CORRECT_PASSWORD = 'steady2026';

            // ---------- render cards ----------
            function buildCards(filterText = '') {
                gallery.innerHTML = '';
                const lowerFilter = filterText.toLowerCase().trim();
                const filtered = sites.filter(s => s.name.toLowerCase().includes(lowerFilter));

                if (filtered.length === 0) {
                    gallery.innerHTML = `
                        <div class="empty-state">
                            <h2>No matching websites</h2>
                            <p>Try a different search term</p>
                        </div>
                    `;
                    return;
                }

                filtered.forEach(site => {
                    const card = document.createElement('a');
                    card.className = 'site-card';
                    card.href = `./${site.path}/`;

                    const iframe = document.createElement('iframe');
                    iframe.className = 'preview-frame';
                    iframe.src = `./${site.path}/`;
                    iframe.loading = 'lazy';
                    iframe.setAttribute('aria-hidden', 'true');
                    iframe.style.pointerEvents = 'none';

                    const label = document.createElement('div');
                    label.className = 'card-label';
                    label.textContent = site.name;

                    card.appendChild(iframe);
                    card.appendChild(label);
                    gallery.appendChild(card);
                });
            }

            // ---------- search ----------
            let searchTimeout = null;
            function handleSearch() {
                if (searchTimeout) clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    buildCards(searchInput.value);
                }, 120);
            }
            searchInput.addEventListener('input', handleSearch);

            // ---------- modal logic ----------
            function openModal() {
                modalOverlay.classList.add('active');
                passwordStep.style.display = 'block';
                createStep.style.display = 'none';
                passwordInput.value = '';
                passwordError.textContent = '';
                createError.textContent = '';
                siteNameInput.value = '';
                htmlContentInput.value = '';
                passwordInput.focus();
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                passwordStep.style.display = 'block';
                createStep.style.display = 'none';
                passwordError.textContent = '';
                createError.textContent = '';
            }

            tildeBtn.addEventListener('click', openModal);

            // cancel buttons
            cancelPwdBtn.addEventListener('click', closeModal);
            cancelCreateBtn.addEventListener('click', closeModal);

            // close on overlay click (but not on modal box)
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            // password unlock
            function tryUnlock() {
                const pwd = passwordInput.value;
                if (pwd === CORRECT_PASSWORD) {
                    // switch to create step
                    passwordStep.style.display = 'none';
                    createStep.style.display = 'block';
                    passwordError.textContent = '';
                    siteNameInput.focus();
                } else {
                    passwordError.textContent = 'Incorrect password. Try again.';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            unlockBtn.addEventListener('click', tryUnlock);
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') tryUnlock();
            });

            // ---------- save new site (create) ----------
            function saveNewSite() {
                const name = siteNameInput.value.trim();
                const html = htmlContentInput.value.trim();

                if (!name) {
                    createError.textContent = 'Site name is required.';
                    return;
                }
                if (!html) {
                    createError.textContent = 'HTML content cannot be empty.';
                    return;
                }

                // generate a path from name (slug)
                const slug = name
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '') || 'site';

                // check for duplicate path
                const exists = sites.some(s => s.path === slug);
                if (exists) {
                    createError.textContent = 'A site with this name already exists.';
                    return;
                }

                // add to sites array
                sites.push({ name: name, path: slug });

                // in a real scenario we would also persist the HTML to a file/folder.
                // here we just show a confirmation and rebuild the gallery.
                // (we also store the HTML in localStorage for demo persistence)
                try {
                    const store = JSON.parse(localStorage.getItem('customSitesHTML') || '{}');
                    store[slug] = html;
                    localStorage.setItem('customSitesHTML', JSON.stringify(store));
                } catch (_) {}

                // rebuild gallery with current search
                buildCards(searchInput.value);

                // close modal
                closeModal();

                // optional: notify
                // (no emoji, just a subtle message)
                const msg = document.createElement('div');
                msg.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#1a1a1a; border:1px solid #3a3a3a; padding:0.6rem 1.8rem; border-radius:40px; color:#ccc; font-size:0.9rem; z-index:999; pointer-events:none; transition:opacity 0.4s;';
                msg.textContent = 'Site added: ' + name;
                document.body.appendChild(msg);
                setTimeout(() => { msg.style.opacity = '0'; }, 2000);
                setTimeout(() => { msg.remove(); }, 2500);
            }

            saveSiteBtn.addEventListener('click', saveNewSite);

            // also allow Ctrl+Enter in textarea
            htmlContentInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    saveNewSite();
                }
            });

            // ---------- load custom sites from localStorage (demo) ----------
            function loadCustomSites() {
                try {
                    const stored = localStorage.getItem('customSitesHTML');
                    if (!stored) return;
                    const htmlMap = JSON.parse(stored);
                    // for each custom site, if not already in sites, add it.
                    // we use the slug from the key.
                    Object.keys(htmlMap).forEach(slug => {
                        const exists = sites.some(s => s.path === slug);
                        if (!exists) {
                            // generate a readable name from slug
                            const name = slug
                                .split('-')
                                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                                .join(' ');
                            sites.push({ name: name, path: slug });
                        }
                    });
                } catch (_) {}
            }

            loadCustomSites();

            // ---------- initial render ----------
            buildCards('');

            // also on Escape key close modal
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        })();
    </script>
</body>
</html>
