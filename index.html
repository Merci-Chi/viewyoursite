<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Websites - Steady Hands Operation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                Oxygen,
                Ubuntu,
                Cantarell,
                sans-serif;

            background: #003333;
            color: #000000;

            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 2rem;
        }

        .site-card {
            aspect-ratio: 1;

            background: #1a1a1a;

            border: 1px solid #333;
            border-radius: 8px;

            padding: 2rem;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            cursor: pointer;

            transition: all 0.3s ease;

            text-decoration: none;
            color: inherit;
        }

        .site-card:hover {
            background: #222;
            border-color: #555;

            transform: translateY(-4px);
        }

        .site-card h2 {
            font-size: 1.5rem;
            font-weight: 500;

            word-break: break-word;

            color: white;
        }

        .empty-state {
            text-align: center;

            padding: 4rem 2rem;

            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state h2 {
            margin-bottom: 1rem;

            font-size: 1.3rem;

            color: white;
        }

        /* ============================= */
        /* LOGIN                         */
        /* ============================= */

        .login-screen {
            min-height: calc(100vh - 4rem);

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;

            background: #1a1a1a;

            border: 1px solid #333;
            border-radius: 12px;

            padding: 2.5rem;
        }

        .login-box h1 {
            color: white;

            text-align: center;

            margin-bottom: 2rem;

            font-size: 2rem;
        }

        .login-box input {
            width: 100%;

            padding: 14px;

            margin-bottom: 1rem;

            border: 1px solid #444;
            border-radius: 6px;

            background: #111;

            color: white;

            font-size: 1rem;

            outline: none;
        }

        .login-box input:focus {
            border-color: #008080;
        }

        .login-box button {
            width: 100%;

            padding: 14px;

            background: #006666;

            color: white;

            border: none;
            border-radius: 6px;

            font-size: 1rem;

            cursor: pointer;

            transition: background 0.2s ease;
        }

        .login-box button:hover {
            background: #008080;
        }

        .login-box button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        #login-error {
            min-height: 20px;

            color: #ff6b6b;

            text-align: center;

            margin-top: 1rem;

            font-size: 0.9rem;
        }

        /* ============================= */
        /* LOGOUT                        */
        /* ============================= */

        #logout-button {
            margin-top: 1rem;

            padding: 10px 18px;

            background: transparent;

            border: 1px solid rgba(0, 0, 0, 0.3);

            color: #000;

            border-radius: 6px;

            cursor: pointer;
        }

        #logout-button:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        #main-site {
            display: none;
        }

        @media (max-width: 768px) {

            h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: 1fr;

                gap: 1rem;
            }

            .site-card {
                aspect-ratio: auto;

                min-height: 120px;
            }

            .login-box {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>


    <!-- ============================= -->
    <!-- LOGIN SCREEN                  -->
    <!-- ============================= -->

    <div
        class="login-screen"
        id="login-screen"
    >

        <div class="login-box">

            <h1>Login</h1>

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="login-button">
                Sign In
            </button>

            <p id="login-error"></p>

        </div>

    </div>



    <!-- ============================= -->
    <!-- MAIN WEBSITE                  -->
    <!-- ============================= -->

    <div id="main-site">

        <div class="container">

            <header>

                <h1>Websites</h1>

                <button id="logout-button">
                    Log Out
                </button>

            </header>


            <div
                class="gallery"
                id="gallery"
            >

                <div
                    class="empty-state"
                    style="grid-column: 1 / -1;"
                >

                    <h2>
                        Loading websites...
                    </h2>

                </div>

            </div>

        </div>

    </div>



    <!-- ============================= -->
    <!-- SUPABASE                      -->
    <!-- ============================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script>

        /*
        ==========================================
        SUPABASE
        ==========================================
        */

        const SUPABASE_URL =
            'https://glonbvrcudwuzjundrii.supabase.co';


        const SUPABASE_KEY =
            'sb_publishable_VZbed_uuOXSE744UrAfHXw_z2xDdYtr';


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /*
        ==========================================
        PROJECTS
        ==========================================

        "key" must match the project_key
        stored in Supabase.

        */

        const sites = [

            {
                key: 'del-carmen',
                name: 'Del Carmen Hair Salon',
                path: 'DelCarmeHairSalon'
            },

            {
                key: 'shop-vezzy',
                name: 'Shop Vezzy',
                path: 'SHOPVEZZY'
            },

            {
                key: 'studio-47',
                name: 'Studio 47 Hair Salon',
                path: 'Studio47HairSalon'
            },

            {
                key: 'favorite-place',
                name: 'Favorite Place to Shop',
                path: 'favoriteplacetoshop'
            },

            {
                key: 'green-house',
                name: 'Green House Water Heaters',
                path: 'GreenHouseWaterHeaters'
            }

        ];



        /*
        ==========================================
        ELEMENTS
        ==========================================
        */

        const loginScreen =
            document.getElementById(
                'login-screen'
            );


        const mainSite =
            document.getElementById(
                'main-site'
            );


        const gallery =
            document.getElementById(
                'gallery'
            );


        const emailInput =
            document.getElementById(
                'email'
            );


        const passwordInput =
            document.getElementById(
                'password'
            );


        const loginButton =
            document.getElementById(
                'login-button'
            );


        const logoutButton =
            document.getElementById(
                'logout-button'
            );


        const loginError =
            document.getElementById(
                'login-error'
            );



        /*
        ==========================================
        SHOW LOGIN
        ==========================================
        */

        function showLogin() {

            mainSite.style.display =
                'none';


            loginScreen.style.display =
                'flex';


            gallery.innerHTML = '';


            passwordInput.value = '';


            loginError.textContent = '';

        }



        /*
        ==========================================
        SHOW WEBSITE
        ==========================================
        */

        function showWebsite() {

            loginScreen.style.display =
                'none';


            mainSite.style.display =
                'block';

        }



        /*
        ==========================================
        LOGIN
        ==========================================
        */

        async function login() {

            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            loginError.textContent = '';


            if (!email || !password) {

                loginError.textContent =
                    'Enter your email and password.';

                return;

            }


            loginButton.disabled = true;


            loginButton.textContent =
                'Signing in...';


            try {

                const {
                    data,
                    error
                } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


                if (error) {

                    loginError.textContent =
                        'Incorrect email or password.';

                    return;

                }


                if (!data.user) {

                    loginError.textContent =
                        'Unable to sign in.';

                    return;

                }


                await loadUserProjects();

            }

            catch (error) {

                console.error(error);


                loginError.textContent =
                    'Something went wrong. Try again.';

            }

            finally {

                loginButton.disabled = false;


                loginButton.textContent =
                    'Sign In';

            }

        }



        /*
        ==========================================
        LOGIN BUTTON
        ==========================================
        */

        loginButton.addEventListener(
            'click',
            login
        );



        /*
        ==========================================
        ENTER TO LOGIN
        ==========================================
        */

        emailInput.addEventListener(
            'keydown',
            event => {

                if (event.key === 'Enter') {

                    login();

                }

            }
        );


        passwordInput.addEventListener(
            'keydown',
            event => {

                if (event.key === 'Enter') {

                    login();

                }

            }
        );



        /*
        ==========================================
        LOGOUT
        ==========================================
        */

        logoutButton.addEventListener(
            'click',
            async () => {

                await supabaseClient
                    .auth
                    .signOut();


                showLogin();

            }
        );



        /*
        ==========================================
        GET LOGGED-IN USER
        ==========================================
        */

        async function getCurrentUser() {

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .getUser();


            if (error) {

                console.error(
                    'Unable to get user:',
                    error
                );


                return null;

            }


            return data.user;

        }



        /*
        ==========================================
        LOAD USER PROJECT ACCESS
        ==========================================
        */

        async function loadUserProjects() {

            showWebsite();


            gallery.innerHTML = `

                <div
                    class="empty-state"
                    style="grid-column: 1 / -1;"
                >

                    <h2>
                        Loading websites...
                    </h2>

                </div>

            `;


            const user =
                await getCurrentUser();


            if (!user) {

                await supabaseClient
                    .auth
                    .signOut();


                showLogin();


                return;

            }



            /*
            RLS automatically restricts this query
            to rows where:

            user_id = auth.uid()

            So we do NOT need to trust a user ID
            supplied by JavaScript.
            */

            const {
                data,
                error
            } =
            await supabaseClient

                .from('project_access')

                .select('project_key');



            if (error) {

                console.error(
                    'Unable to load projects:',
                    error
                );


                gallery.innerHTML = `

                    <div
                        class="empty-state"
                        style="grid-column: 1 / -1;"
                    >

                        <h2>
                            Unable to load websites
                        </h2>

                        <p>
                            Please try again.
                        </p>

                    </div>

                `;


                return;

            }



            /*
            Convert the returned rows into
            a list of project keys.
            */

            const allowedProjectKeys =
                data.map(
                    row => row.project_key
                );



            /*
            Only keep projects that the
            logged-in user is allowed to see.
            */

            const allowedSites =
                sites.filter(

                    site =>
                        allowedProjectKeys
                            .includes(site.key)

                );



            renderSites(
                allowedSites
            );

        }



        /*
        ==========================================
        RENDER PROJECTS
        ==========================================
        */

        function renderSites(
            allowedSites
        ) {

            gallery.innerHTML = '';



            if (
                allowedSites.length === 0
            ) {

                gallery.innerHTML = `

                    <div
                        class="empty-state"
                        style="grid-column: 1 / -1;"
                    >

                        <h2>
                            No websites assigned
                        </h2>

                        <p>
                            You currently do not
                            have access to any
                            projects.
                        </p>

                    </div>

                `;


                return;

            }



            allowedSites.forEach(
                site => {

                    const card =
                        document.createElement(
                            'a'
                        );


                    card.href =
                        `./${site.path}/`;


                    card.className =
                        'site-card';


                    const title =
                        document.createElement(
                            'h2'
                        );


                    title.textContent =
                        site.name;


                    card.appendChild(
                        title
                    );


                    gallery.appendChild(
                        card
                    );

                }
            );

        }



        /*
        ==========================================
        CHECK EXISTING LOGIN
        ==========================================
        */

        async function checkLogin() {

            const user =
                await getCurrentUser();


            if (user) {

                await loadUserProjects();

            }

            else {

                showLogin();

            }

        }



        /*
        ==========================================
        AUTH STATE CHANGES
        ==========================================
        */

        supabaseClient
            .auth
            .onAuthStateChange(

                (event, session) => {

                    if (!session) {

                        showLogin();

                    }

                }

            );



        /*
        ==========================================
        START
        ==========================================
        */

        checkLogin();

    </script>

</body>
</html>
