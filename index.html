<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Websites · Steady Hands Operation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 1.5rem;
        }

        /* search bar */
        .search-row {
            max-width: 480px;
            margin: 0 auto 2rem auto;
        }

        #searchInput {
            width: 100%;
            padding: 0.75rem 1.2rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        #searchInput:focus {
            border-color: #777;
        }

        #searchInput::placeholder {
            color: #666;
            font-weight: 300;
        }

        /* gallery grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        /* card with iframe preview - no scrollbars */
        .site-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            transition: border 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .site-card:hover {
            border-color: #4a4a4a;
            transform: translateY(-3px);
        }

        /* iframe wrapper to hide scrollbars cleanly */
        .preview-wrap {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #1a1a1a;
            overflow: hidden;          /* hides any scrollbar that might appear */
            position: relative;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;      /* prevent interaction inside preview */
            /* hide scrollbars on all browsers */
            scrollbar-width: none;     /* Firefox */
            -ms-overflow-style: none;  /* IE / Edge */
        }

        /* hide scrollbar for WebKit (Chrome, Safari, Edge) */
        .preview-frame::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .card-label {
            padding: 0.9rem 0.8rem 0.8rem 0.8rem;
            background: #141414;
            border-top: 1px solid #282828;
            font-size: 0.95rem;
            font-weight: 450;
            letter-spacing: 0.2px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #d0d0d0;
        }

        /* empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1.5rem;
            color: #666;
        }

        .empty-state h2 {
            font-weight: 400;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.95rem;
            color: #555;
        }

        /* responsive */
        @media (max-width: 700px) {
            h1 { font-size: 2rem; }
            .gallery { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .preview-wrap { aspect-ratio: 16 / 11; }
            .card-label { font-size: 0.8rem; padding: 0.6rem 0.4rem; }
        }

        @media (max-width: 480px) {
            .gallery { grid-template-columns: 1fr; }
        }

        /* hidden state for filtering */
        .site-card.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Websites</h1>
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Filter websites by name" autocomplete="off">
            </div>
        </header>

        <div class="gallery" id="gallery">
            <!-- cards injected by javascript -->
        </div>
    </div>

    <script>
        (function() {
            // --------------------------------------------------------------
            // site data – name (display) + path (relative folder)
            // --------------------------------------------------------------
            const sites = [
                { name: 'Del Carmen Hair Salon', path: 'DelCarmeHairSalon' },
                { name: 'Shop Vezzy', path: 'SHOPVEZZY' },
                { name: 'Studio 47 Hair Salon', path: 'Studio47HairSalon' },
                { name: 'Favorite Place to Shop', path: 'favoriteplacetoshop' },
                { name: 'Green House Water Heaters', path: 'GreenHouseWaterHeaters' }
            ];

            const gallery = document.getElementById('gallery');
            const searchInput = document.getElementById('searchInput');

            // ---------- build cards ----------
            function buildCards(filterText = '') {
                gallery.innerHTML = '';

                const lowerFilter = filterText.toLowerCase().trim();

                const filtered = sites.filter(site =>
                    site.name.toLowerCase().includes(lowerFilter)
                );

                if (filtered.length === 0) {
                    gallery.innerHTML = `
                        <div class="empty-state">
                            <h2>No matching websites</h2>
                            <p>Try a different search term</p>
                        </div>
                    `;
                    return;
                }

                // create card for each site
                filtered.forEach(site => {
                    const card = document.createElement('a');
                    card.className = 'site-card';
                    card.href = `./${site.path}/`;

                    // ----- iframe wrapper (hides scrollbars) -----
                    const wrap = document.createElement('div');
                    wrap.className = 'preview-wrap';

                    const iframe = document.createElement('iframe');
                    iframe.className = 'preview-frame';
                    iframe.src = `./${site.path}/`;
                    iframe.loading = 'lazy';
                    iframe.setAttribute('aria-hidden', 'true');
                    // extra safety: prevent scrollbars via style
                    iframe.style.scrollbarWidth = 'none';      // Firefox
                    iframe.style.overflow = 'hidden';          // fallback
                    // webkit scrollbar hiding (already via CSS, but double‑check)
                    iframe.style.webkitScrollbar = 'none';

                    wrap.appendChild(iframe);

                    // label
                    const label = document.createElement('div');
                    label.className = 'card-label';
                    label.textContent = site.name;

                    card.appendChild(wrap);
                    card.appendChild(label);
                    gallery.appendChild(card);
                });
            }

            // ---------- search handler ----------
            let searchTimeout = null;
            function handleSearch() {
                const query = searchInput.value;
                if (searchTimeout) clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    buildCards(query);
                }, 120);
            }

            // ---------- initial render ----------
            buildCards('');

            // ---------- attach events ----------
            searchInput.addEventListener('input', handleSearch);

            // escape key clears search
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    buildCards('');
                    searchInput.blur();
                }
            });
        })();
    </script>
</body>
</html>
