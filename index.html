<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websites · Steady Hands Operation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
            overflow-x: hidden;
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            width: min(1300px, 100%);
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2.8rem;
            font-weight: 300;
        }

        #searchInput {
            width: min(480px, 100%);
            padding: 0.75rem 1.2rem;
            border: 1px solid #333;
            border-radius: 999px;
            outline: none;
            background: #1a1a1a;
            color: #e0e0e0;
            font: inherit;
        }

        #searchInput:focus {
            border-color: #777;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        .site-card {
            display: block;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            background: #141414;
            color: inherit;
            text-decoration: none;
            transition: transform 0.2s, border-color 0.2s;
        }

        .site-card:hover {
            transform: translateY(-3px);
            border-color: #4a4a4a;
        }

        .preview-wrapper {
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #1a1a1a;
        }

        .preview-frame {
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 0;
            pointer-events: none;
        }

        .card-label {
            padding: 0.9rem 0.8rem;
            overflow: hidden;
            border-top: 1px solid #282828;
            color: #d0d0d0;
            text-align: center;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 4rem 1rem;
            color: #666;
            text-align: center;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .card-label {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Websites</h1>

            <input
                type="search"
                id="searchInput"
                placeholder="Filter websites by name"
                autocomplete="off"
            >
        </header>

        <section class="gallery" id="gallery"></section>
    </main>

    <script>
        const sites = [
            { name: "Del Carmen Hair Salon", path: "delcarmenhairsalon" },
            { name: "Shop Vezzy", path: "shopvezzy" },
            { name: "Studio 47 Hair Salon", path: "studio47hairsalon" },
            { name: "Favorite Place to Shop", path: "favoriteplacetoshop" },
            { name: "Green House Water Heaters", path: "greenhousewaterheaters" }
        ];

        const gallery = document.getElementById("gallery");
        const searchInput = document.getElementById("searchInput");

        function renderSites(filter = "") {
            const search = filter.trim().toLowerCase();

            const filteredSites = sites.filter(site =>
                site.name.toLowerCase().includes(search)
            );

            gallery.innerHTML = "";

            if (!filteredSites.length) {
                gallery.innerHTML =
                    '<div class="empty-state">No matching websites</div>';
                return;
            }

            filteredSites.forEach(site => {
                const card = document.createElement("a");

                card.className = "site-card";
                card.href = `./${site.path}/`;

                card.innerHTML = `
                    <div class="preview-wrapper">
                        <iframe
                            class="preview-frame"
                            src="./${site.path}/"
                            loading="lazy"
                            scrolling="no"
                            tabindex="-1"
                            aria-hidden="true"
                        ></iframe>
                    </div>

                    <div class="card-label">${site.name}</div>
                `;

                gallery.appendChild(card);
            });
        }

        searchInput.addEventListener("input", event => {
            renderSites(event.target.value);
        });

        renderSites();
    </script>
</body>
</html>
