<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Your Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
            overflow-x: hidden;
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            width: min(1300px, 100%);
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2.8rem;
            font-weight: 300;
        }

        #searchInput {
            width: min(480px, 100%);
            padding: 0.75rem 1.2rem;
            border: 1px solid #333;
            border-radius: 999px;
            outline: none;
            background: #1a1a1a;
            color: #e0e0e0;
            font: inherit;
        }

        #searchInput:focus {
            border-color: #777;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        .site-card {
            display: block;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            background: #141414;
            color: inherit;
            text-decoration: none;
            transition: transform 0.2s, border-color 0.2s;
        }

        .site-card:hover {
            transform: translateY(-3px);
            border-color: #4a4a4a;
        }

        .preview-wrapper {
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #1a1a1a;
        }

        .preview-frame {
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 0;
            pointer-events: none;
        }

        .card-label {
            padding: 0.9rem 0.8rem;
            overflow: hidden;
            border-top: 1px solid #282828;
            color: #d0d0d0;
            text-align: center;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 4rem 1rem;
            color: #666;
            text-align: center;
        }

        .account-button {
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            border: 1px solid #444;
            border-radius: 999px;
            background: #202020;
            color: #fff;
            cursor: pointer;
            font: inherit;
        }

        .account-button:hover { border-color: #777; background: #292929; }
        .portal-overlay { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 1rem; background: rgba(0,0,0,.84); }
        .portal-overlay[hidden], [hidden] { display: none !important; }
        .portal-dialog { position: relative; width: min(520px,100%); max-height: 90vh; overflow-y: auto; padding: 2rem; border: 1px solid #333; border-radius: 16px; background: #151515; box-shadow: 0 24px 70px rgba(0,0,0,.55); }
        .portal-close { position: absolute; top: .8rem; right: .8rem; width: 38px; height: 38px; border: 0; border-radius: 50%; background: #252525; color: #fff; cursor: pointer; font-size: 1.4rem; }
        .portal-dialog h2 { margin-bottom: .5rem; font-weight: 500; }
        .portal-description { margin-bottom: 1.5rem; color: #888; line-height: 1.5; }
        .portal-form { display: grid; gap: 1rem; }
        .portal-form input { width: 100%; padding: .85rem 1rem; border: 1px solid #333; border-radius: 9px; outline: none; background: #1d1d1d; color: #fff; font: inherit; }
        .portal-form input:focus { border-color: #777; }
        .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; margin-bottom: 1rem; padding: .3rem; border-radius: 10px; background: #202020; }
        .auth-tab { padding: .7rem; border: 0; border-radius: 8px; background: transparent; color: #888; cursor: pointer; font: inherit; }
        .auth-tab.active { background: #333; color: #fff; }
        .social-auth { display: grid; grid-template-columns: 1fr; gap: .75rem; margin-bottom: 1rem; }
        .social-auth button { padding: .8rem; border: 1px solid #3a3a3a; border-radius: 9px; background: #202020; color: #fff; cursor: pointer; font: inherit; }
        .social-auth button:hover { border-color: #777; }
        .auth-divider { display: flex; align-items: center; gap: .75rem; margin: 1rem 0; color: #666; font-size: .8rem; text-transform: uppercase; }
        .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: #303030; }
        .portal-primary, .portal-secondary { padding: .85rem 1rem; border-radius: 9px; cursor: pointer; font: inherit; }
        .portal-primary { border: 0; background: #f1f1f1; color: #111; font-weight: 700; }
        .portal-secondary { border: 1px solid #3a3a3a; background: #202020; color: #ddd; }
        .portal-message { min-height: 1.5rem; margin-top: 1rem; color: #aaa; line-height: 1.5; }
        .portal-account-header { margin-bottom: 1.25rem; padding-right: 2rem; }
        .portal-account-email { color: #888; }
        .subscription-list { display: grid; gap: 1rem; }
        .subscription-card { padding: 1rem; border: 1px solid #303030; border-radius: 12px; background: #1c1c1c; }
        .subscription-card h3 { margin-bottom: .75rem; font-size: 1.05rem; }
        .subscription-row { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem 0; color: #aaa; }
        .subscription-row strong { color: #eee; text-align: right; }
        .portal-actions { display: flex; gap: .75rem; margin-top: 1.5rem; }
        .portal-actions button { flex: 1; }

        @media (max-width: 700px) {
            h1 { font-size: 2rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .card-label { font-size: 0.8rem; }
        }

        @media (max-width: 480px) {
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <main class="container">
        <header>
            <h1>Websites</h1>

            <input
                type="search"
                id="searchInput"
                placeholder="Filter websites by name"
                autocomplete="off"
            >

            <br>
            <button class="account-button" id="clientAccountButton" type="button">Client Login</button>
        </header>

        <section class="gallery" id="gallery"></section>
    </main>

    <script>
        // REPLACE 'your-repo-name' with your actual GitHub repo name (e.g., "my-websites")
        const GITHUB_USER = "Merci-Chi";
        const GITHUB_REPO = "viewyoursite"; // <-- CHANGE THIS

        const gallery = document.getElementById("gallery");
        const searchInput = document.getElementById("searchInput");

        async function fetchSites() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
                const data = await response.json();

                const sites = data
                    .filter(item => item.type === "dir") // only folders
                    .map(folder => {
                        const prettyName = folder.name
                            .replace(/-/g, " ")
                            .replace(/\b\w/g, c => c.toUpperCase());
                        return { name: prettyName, path: `./${folder.name}/` };
                    });

                renderSites(sites);
            } catch (error) {
                console.error("Failed to fetch sites:", error);
                gallery.innerHTML = '<div class="empty-state">Could not load sites. Check your GitHub repo settings.</div>';
            }
        }

        function renderSites(sites = []) {
            const search = searchInput.value.trim().toLowerCase();

            const filteredSites = sites.filter(site =>
                site.name.toLowerCase().includes(search)
            );

            gallery.innerHTML = "";

            if (!filteredSites.length) {
                gallery.innerHTML = '<div class="empty-state">No matching websites</div>';
                return;
            }

            filteredSites.forEach(site => {
                const card = document.createElement("a");
                card.className = "site-card";
                card.href = site.path;

                card.innerHTML = `
                    <div class="preview-wrapper">
                        <iframe
                            class="preview-frame"
                            src="${site.path}"
                            loading="lazy"
                            scrolling="no"
                            tabindex="-1"
                            aria-hidden="true"
                        ></iframe>
                    </div>
                    <div class="card-label">${site.name}</div>
                `;

                gallery.appendChild(card);
            });
        }

        searchInput.addEventListener("input", () => {
            // Re-render using the already fetched list (stored globally)
            renderSites(window._allSites || []);
        });

        // Initial fetch
        fetchSites().then(() => {
            // Save the full list for search filtering
            const cards = document.querySelectorAll('.site-card');
            const allSites = [];
            cards.forEach(card => {
                const label = card.querySelector('.card-label').textContent;
                const path = card.getAttribute('href');
                allSites.push({ name: label, path: path });
            });
            window._allSites = allSites;
        });
    </script>

    <!-- PORTAL & SUPABASE (Keep as is) -->
    <div class="portal-overlay" id="portalOverlay" hidden>
        <section class="portal-dialog" role="dialog" aria-modal="true" aria-labelledby="portalTitle">
            <button class="portal-close" id="portalClose" type="button" aria-label="Close">×</button>
            <div id="portalLoginView">
                <h2 id="portalTitle">Client Account</h2>
                <p class="portal-description">Sign up or log in using the same email used for your hosting subscription.</p>
                <div class="auth-tabs" role="tablist" aria-label="Account access">
                    <button class="auth-tab active" id="loginTab" type="button" role="tab" aria-selected="true">Log In</button>
                    <button class="auth-tab" id="signupTab" type="button" role="tab" aria-selected="false">Sign Up</button>
                </div>
                <div class="social-auth">
                    <button id="googleAuth" type="button">Continue with Google</button>
                </div>
                <div class="auth-divider">or use email</div>
                <form class="portal-form" id="portalLoginForm">
                    <input id="portalFullName" type="text" placeholder="Full name" autocomplete="name" hidden>
                    <input id="portalEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
                    <input id="portalPassword" type="password" placeholder="Password" autocomplete="current-password" minlength="8" required>
                    <button class="portal-primary" id="emailAuthSubmit" type="submit">Log In</button>
                </form>
                <p class="portal-message" id="portalLoginMessage"></p>
            </div>
            <div id="portalAccountView" hidden>
                <header class="portal-account-header">
                    <h2>My Account</h2>
                    <p class="portal-account-email" id="portalAccountEmail"></p>
                </header>
                <div class="subscription-list" id="subscriptionList"></div>
                <p class="portal-message" id="subscriptionMessage"></p>
                <div class="portal-actions">
                    <button class="portal-secondary" id="refreshSubscriptions" type="button">Refresh</button>
                    <button class="portal-secondary" id="portalSignOut" type="button">Sign Out</button>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://glonbvrcudwuzjundrii.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_VZbed_uuOXSE744UrAfHXw_z2xDdYtr";
        const portalSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const accountButton = document.getElementById("clientAccountButton");
        const portalOverlay = document.getElementById("portalOverlay");
        const portalClose = document.getElementById("portalClose");
        const loginView = document.getElementById("portalLoginView");
        const accountView = document.getElementById("portalAccountView");
        const loginForm = document.getElementById("portalLoginForm");
        const loginMessage = document.getElementById("portalLoginMessage");
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");
        const fullNameInput = document.getElementById("portalFullName");
        const passwordInput = document.getElementById("portalPassword");
        const emailAuthSubmit = document.getElementById("emailAuthSubmit");
        const accountEmail = document.getElementById("portalAccountEmail");
        const subscriptionList = document.getElementById("subscriptionList");
        const subscriptionMessage = document.getElementById("subscriptionMessage");

        let authMode = "login";
        function openPortal() { portalOverlay.hidden = false; document.body.style.overflow = "hidden"; }
        function closePortal() { portalOverlay.hidden = true; document.body.style.overflow = ""; }
        function setAuthMode(mode) {
            authMode = mode;
            const signingUp = mode === "signup";
            loginTab.classList.toggle("active", !signingUp);
            signupTab.classList.toggle("active", signingUp);
            loginTab.setAttribute("aria-selected", String(!signingUp));
            signupTab.setAttribute("aria-selected", String(signingUp));
            fullNameInput.hidden = !signingUp;
            fullNameInput.required = signingUp;
            passwordInput.autocomplete = signingUp ? "new-password" : "current-password";
            emailAuthSubmit.textContent = signingUp ? "Create Account" : "Log In";
            loginMessage.textContent = "";
        }
        async function signInWithProvider(provider) {
            loginMessage.textContent = "Opening Google…";
            const { error } = await portalSupabase.auth.signInWithOAuth({
                provider,
                options: { redirectTo: "https://viewyoursite.today" }
            });
            if (error) loginMessage.textContent = error.message;
        }
        function formatMoney(cents) { return typeof cents === "number" ? new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(cents / 100) : "See Square invoice"; }
        function formatCadence(cadence) { return ({ MONTHLY: "Every month", EVERY_SIX_MONTHS: "Every 6 months", ANNUAL: "Every year" })[cadence] || cadence || "Not available"; }
        function addRow(card, label, value) {
            const row = document.createElement("div"); row.className = "subscription-row";
            const left = document.createElement("span"); left.textContent = label;
            const right = document.createElement("strong"); right.textContent = value;
            row.append(left, right); card.appendChild(row);
        }
        function renderSubscriptions(subscriptions) {
            subscriptionList.replaceChildren();
            if (!subscriptions.length) { subscriptionMessage.textContent = "No hosting subscription was found for this email."; return; }
            subscriptionMessage.textContent = "";
            subscriptions.forEach(subscription => {
                const card = document.createElement("article"); card.className = "subscription-card";
                const title = document.createElement("h3"); title.textContent = subscription.planName || "Website Hosting"; card.appendChild(title);
                addRow(card, "Status", subscription.status || "Unknown");
                addRow(card, "Price", formatMoney(subscription.amountCents));
                addRow(card, "Billing", formatCadence(subscription.billingCadence));
                addRow(card, "Paid through", subscription.chargedThroughDate || "Not available");
                subscriptionList.appendChild(card);
            });
        }
        async function loadSubscriptions() {
            subscriptionMessage.textContent = "Loading your subscription…"; subscriptionList.replaceChildren();
            const { data, error } = await portalSupabase.functions.invoke("square-subscriptions", { method: "GET" });
            if (error) { subscriptionMessage.textContent = "We couldn’t load your subscription right now."; return; }
            renderSubscriptions(data?.subscriptions || []);
        }
        async function updatePortal(session) {
            if (!session?.user) { loginView.hidden = false; accountView.hidden = true; accountButton.textContent = "Client Login"; return; }
            loginView.hidden = true; accountView.hidden = false; accountButton.textContent = "My Account"; accountEmail.textContent = session.user.email || "";
            await loadSubscriptions();
        }

        accountButton.addEventListener("click", async () => { openPortal(); const { data: { session } } = await portalSupabase.auth.getSession(); await updatePortal(session); });
        portalClose.addEventListener("click", closePortal);
        portalOverlay.addEventListener("click", event => { if (event.target === portalOverlay) closePortal(); });
        loginTab.addEventListener("click", () => setAuthMode("login"));
        signupTab.addEventListener("click", () => setAuthMode("signup"));
        document.getElementById("googleAuth").addEventListener("click", () => signInWithProvider("google"));
        loginForm.addEventListener("submit", async event => {
            event.preventDefault();
            const email = document.getElementById("portalEmail").value.trim();
            const password = passwordInput.value;
            loginMessage.textContent = authMode === "signup" ? "Creating your account…" : "Logging you in…";
            let result;
            if (authMode === "signup") {
                result = await portalSupabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: { full_name: fullNameInput.value.trim() },
                        emailRedirectTo: "https://viewyoursite.today"
                    }
                });
            } else {
                result = await portalSupabase.auth.signInWithPassword({ email, password });
            }
            if (result.error) {
                loginMessage.textContent = result.error.message;
            } else if (authMode === "signup" && !result.data.session) {
                loginMessage.textContent = "Account created. Check your email to confirm it, then log in.";
            } else {
                loginMessage.textContent = "Success.";
                await updatePortal(result.data.session);
            }
        });
        document.getElementById("refreshSubscriptions").addEventListener("click", loadSubscriptions);
        document.getElementById("portalSignOut").addEventListener("click", async () => { await portalSupabase.auth.signOut(); await updatePortal(null); });
        portalSupabase.auth.onAuthStateChange(async (_event, session) => { await updatePortal(session); });
    </script>
</body>
</html>
