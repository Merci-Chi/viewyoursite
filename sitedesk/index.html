<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <title>SiteDesk</title>
  <link rel="icon" href="logo.png"/>
  <link rel="apple-touch-icon" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="app.css?v=sb6"/>
</head>
<body>
  <div id="app">
    <div class="login">
      <form id="login-form">
        <img class="login-logo" src="logo.png" alt="SiteDesk"/>
        <h1 class="display">SiteDesk</h1>
        <label class="field"><span>Email</span><input name="email" type="email" required autocomplete="username"/></label>
        <label class="field"><span>Password</span><input name="password" type="password" required autocomplete="current-password"/></label>
        <div class="row" style="justify-content:center"><button class="btn primary" type="submit">Sign in</button></div>
        <p id="login-err" class="hint bad-text"></p>
      </form>
    </div>
  </div>
  <div id="toasts" class="toast-wrap" aria-live="polite"></div>
  <script>
    window.addEventListener("error", function (e) {
      var err = document.getElementById("login-err");
      if (err && e && e.message) err.textContent = e.message;
    });
  </script>
  <script src="app.js?v=sb6"></script>
</body>
</html>
