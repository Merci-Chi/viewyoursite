<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Larson Air</title>
<meta name="description" content="Larson Air">
<style>
:root{--bg:#eef5f8;--text:#123043;--muted:#607584;--accent:#2f85b5;--accent-text:#fff;--section:#f7fbfc;--header:rgba(238,245,248,.9);--mobile:#eef5f8;--footer:#e1edf2;--line:rgba(18,48,67,.14);--modal-bg:#f7fbfc;--modal-text:#123043;--modal-muted:#607584;--hero-image:url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1800&q=86');--overlay:linear-gradient(90deg,rgba(9,35,50,.8),rgba(9,35,50,.18));}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-user-select:none;user-select:none}
body.modal-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
header{position:fixed;inset:0 0 auto 0;z-index:30;background:var(--header);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header-inner{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-size:1rem;font-weight:800;letter-spacing:.02em}
nav{display:flex;align-items:center;gap:24px}
nav a{font-size:.9rem;font-weight:700;opacity:.8}
nav a:hover{opacity:1}
.menu{display:none;position:relative;width:44px;height:44px;border:0;background:transparent;cursor:pointer}
.menu span,.menu:before,.menu:after{content:"";position:absolute;left:10px;right:10px;height:2px;background:currentColor;transition:.2s}
.menu:before{top:14px} .menu span{top:21px} .menu:after{top:28px}
.menu.open:before{transform:translateY(7px) rotate(45deg)}
.menu.open span{opacity:0}
.menu.open:after{transform:translateY(-7px) rotate(-45deg)}
.hero{min-height:100vh;display:grid;align-items:end;position:relative;overflow:hidden}
.hero-media{position:absolute;inset:0;background-image:var(--hero-image);background-size:cover;background-position:center;transform:scale(1.02);animation:drift 16s ease-in-out infinite alternate}
.hero-media:after{content:"";position:absolute;inset:0;background:var(--overlay)}
.hero-content{position:relative;z-index:2;padding:150px 0 70px}
.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:.74rem;font-weight:800;opacity:.85;margin-bottom:16px}
h1{font-size:clamp(3.5rem,9vw,8.5rem);line-height:.9;letter-spacing:-.055em;margin:0;max-width:1050px;text-wrap:balance}
.hero-rule{width:120px;height:2px;background:var(--accent);margin:30px 0 0}
.intro{padding:88px 0;background:var(--section)}
.intro-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:70px;align-items:end}
.intro h2{font-size:clamp(2rem,4vw,4rem);line-height:1;margin:0;letter-spacing:-.04em}
.intro p{margin:0;color:var(--muted);max-width:560px;font-size:1.05rem}
.gallery{display:grid;grid-template-columns:1.25fr .75fr;min-height:560px}
.panel{position:relative;min-height:360px;background-size:cover;background-position:center;overflow:hidden}
.panel:after{content:"Stock image";position:absolute;left:16px;bottom:14px;background:rgba(0,0,0,.62);color:#fff;font-size:.7rem;letter-spacing:.06em;padding:6px 8px}
.panel.secondary{display:grid;grid-template-rows:1fr 1fr}
.quote{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--accent);color:var(--accent-text);font-size:clamp(1.4rem,3vw,2.5rem);font-weight:800;line-height:1.05}
.footer{padding:34px 0;background:var(--footer);border-top:1px solid var(--line)}
.footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:.88rem;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal-backdrop.show{display:flex}
.modal{width:min(440px,100%);background:var(--modal-bg);color:var(--modal-text);padding:30px;border:1px solid var(--line);box-shadow:0 25px 70px rgba(0,0,0,.35)}
.modal h2{margin:0 0 10px;font-size:1.55rem}
.modal p{margin:0 0 22px;color:var(--modal-muted)}
.modal-close{width:100%;min-height:48px;border:0;background:var(--accent);color:var(--accent-text);font-weight:800;cursor:pointer}
@keyframes drift{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.07) translate3d(-1%, -1%,0)}}
@media(max-width:820px){
  .wrap{width:min(100% - 28px,1180px)}
  .header-inner{height:68px}
  .menu{display:block}
  nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--mobile);padding:12px 20px 18px;flex-direction:column;align-items:flex-start;border-bottom:1px solid var(--line)}
  nav.open{display:flex}
  nav a{width:100%;padding:10px 0}
  .hero-content{padding:125px 0 46px}
  h1{font-size:clamp(3rem,17vw,5.5rem)}
  .intro{padding:58px 0}
  .intro-grid{grid-template-columns:1fr;gap:26px}
  .gallery{grid-template-columns:1fr;min-height:auto}
  .panel{min-height:300px}
  .panel.secondary{grid-template-rows:auto auto}
  .quote{min-height:220px}
  .footer-inner{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a class="brand" href="#home">Larson Air</a>
    <button class="menu" type="button" aria-label="Open navigation" aria-expanded="false" data-menu><span></span></button>
    <nav data-nav>
      <a href="#home">Home</a>
      <a href="#overview">Overview</a>
      <a href="#visuals">Visuals</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-media" aria-hidden="true"></div>
    <div class="wrap hero-content">
      <div class="kicker">Larson Air</div>
      <h1>Larson Air</h1>
      <div class="hero-rule"></div>
    </div>
  </section>

  <section class="intro" id="overview">
    <div class="wrap intro-grid">
      <h2>Larson Air</h2>
      
    </div>
  </section>

  <section class="gallery" id="visuals" aria-label="Stock imagery">
    <div class="panel" style="background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=84')"></div>
    <div class="panel secondary">
      <div class="panel" style="background-image:url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1000&q=84')"></div>
      <div class="quote">Larson Air</div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <strong>Larson Air</strong>
    <a href="#home">Back to top</a>
  </div>
</footer>


<div class="modal-backdrop" id="lockedModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="lockedTitle">
    <h2 id="lockedTitle">This is currently locked.</h2>
    <p>This feature is part of the full website. Purchase the site to unlock it.</p>
    <button type="button" class="modal-close" data-close>Close</button>
  </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', () => {
  const menuBtn = document.querySelector('[data-menu]');
  const nav = document.querySelector('[data-nav]');
  if (menuBtn && nav) {
    menuBtn.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      menuBtn.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.querySelectorAll('a[href^="#"]').forEach(link => {
      link.addEventListener('click', () => {
        nav.classList.remove('open');
        menuBtn.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
      });
    });
  }

  document.querySelectorAll('a[href^="#"]').forEach(link => {
    link.addEventListener('click', e => {
      const target = document.querySelector(link.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
  });

  const modal = document.getElementById('lockedModal');
  let lastFocus = null;
  function openModal(e) {
    e.preventDefault();
    if (!modal) return;
    lastFocus = document.activeElement;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    document.body.classList.add('modal-open');
    modal.querySelector('[data-close]')?.focus();
  }
  function closeModal() {
    if (!modal) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
    document.body.classList.remove('modal-open');
    lastFocus?.focus();
  }

  document.querySelectorAll('[data-locked="true"]').forEach(el => el.addEventListener('click', openModal));
  modal?.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));
  modal?.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal?.classList.contains('show')) closeModal(); });
});
</script>

</body>
</html>
