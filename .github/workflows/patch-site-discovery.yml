name: Patch site folder discovery

on:
  push:
    paths:
      - '.github/workflows/patch-site-discovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '        async function fetchSites() {\n'
          end_marker = '\n\n\n        const gallery = document.getElementById("gallery");'

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate fetchSites() block')

          replacement = '''        async function fetchSites() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1`
                );
                if (!response.ok) throw new Error(`GitHub API failed: ${response.status}`);
                const data = await response.json();

                if (!Array.isArray(data.tree)) throw new Error("GitHub tree response was invalid");
                if (data.truncated) console.warn("GitHub returned a truncated repository tree.");

                const prefix = `${SITES_FOLDER}/`;
                const discoveredSites = data.tree
                    .filter(item => {
                        if (item.type !== "tree" || !item.path.startsWith(prefix)) return false;
                        const relativePath = item.path.slice(prefix.length);
                        return relativePath && !relativePath.includes("/");
                    })
                    .map(item => {
                        const folderName = item.path.slice(prefix.length);
                        const prettyName = folderName
                            .trim()
                            .replace(/-/g, " ")
                            .replace(/\\b\\w/g, c => c.toUpperCase());
                        return { name: prettyName, path: folderName, hostingType: "standard" };
                    });

                const orderIndex = new Map(SITE_ORDER.map((path, index) => [path, index]));
                const listedSites = discoveredSites
                    .filter(site => orderIndex.has(site.path))
                    .sort((a, b) => orderIndex.get(a.path) - orderIndex.get(b.path));
                const unlistedSites = discoveredSites
                    .filter(site => !orderIndex.has(site.path))
                    .sort((a, b) => a.name.localeCompare(b.name));

                sites = [...listedSites, ...unlistedSites];

                try {
                    await fetchClaimedSitePaths();
                } catch (claimError) {
                    console.warn("Claim registry is unavailable; showing the website directory without claim filtering.", claimError);
                    claimedSitePaths.clear();
                    claimRegistryLoaded = false;
                }
                renderSites();
            } catch (error) {
                console.error("Failed to fetch available sites:", error);
                sites = [];
                claimRegistryLoaded = false;
                renderSites();
            }
        }'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-site-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-site-discovery.yml
          git commit -m "Fix discovery of folders in Sites directory"
          git push origin main
