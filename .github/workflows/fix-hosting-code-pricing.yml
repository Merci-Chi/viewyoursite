name: Fix hosting pricing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run hosting pricing patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_hosting_pricing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-hosting-code-pricing.yml
          rm .github/scripts/fix_hosting_pricing.py
          git add index.html .github/workflows/fix-hosting-code-pricing.yml .github/scripts/fix_hosting_pricing.py
          git commit -m "Fix hosting prices and code discount display"
          git push
